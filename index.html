<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="병원부산3사무소 성과관리 플랫폼 (시제품)">
<title>HB3 SCOPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#f4f6f6; --surface:#ffffff; --surface-2:#fafbfb;
  --ink:#0d1618; --ink-2:#4e5c5e; --muted:#82908f;
  --grid:#e4e9e8; --rule:#d5dedd; --hair:rgba(13,22,24,.10);
  --accent:#0d5c69; --accent-ink:#0d5c69; --accent-soft:rgba(13,92,105,.09);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#046b04; --crit-ink:#b52c2c;
  --shadow:0 1px 2px rgba(13,22,24,.05), 0 8px 24px -18px rgba(13,22,24,.35);
  --sans:"IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --disp:"Archivo", var(--sans);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0a1012; --surface:#121a1c; --surface-2:#172023;
    --ink:#f2f6f6; --ink-2:#b6c3c3; --muted:#7f8d8d;
    --grid:#222d2f; --rule:#2f3b3d; --hair:rgba(242,246,246,.10);
    --accent:#4bb8c8; --accent-ink:#7fd4e0; --accent-soft:rgba(75,184,200,.13);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#25a325;
    --good-ink:#3fc23f; --crit-ink:#f08383;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0a1012; --surface:#121a1c; --surface-2:#172023;
  --ink:#f2f6f6; --ink-2:#b6c3c3; --muted:#7f8d8d;
  --grid:#222d2f; --rule:#2f3b3d; --hair:rgba(242,246,246,.10);
  --accent:#4bb8c8; --accent-ink:#7fd4e0; --accent-soft:rgba(75,184,200,.13);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#25a325;
  --good-ink:#3fc23f; --crit-ink:#f08383;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);font-family:var(--sans);font-weight:400;
     font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* ── 게이트 ─────────────────────────────── */
#gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(120% 90% at 50% 0%, #12333a 0%, #0a1c21 45%, #060f12 100%);padding:24px}
#gate .box{width:min(360px,100%);text-align:center;color:#dceaec}
#gate .mark{width:46px;height:46px;margin:0 auto 18px;border-radius:12px;
      background:linear-gradient(150deg,#57c7d6,#0d5c69);transform:rotate(45deg);
      box-shadow:0 10px 30px -10px rgba(87,199,214,.6)}
#gate h1{font-family:var(--disp);font-size:27px;letter-spacing:.16em;color:#eaf6f7;font-weight:700}
#gate .sub{font-size:12.5px;color:#8fb3b8;margin-top:6px}
#gate .msg{font-size:12.5px;color:#a9ccd1;margin:22px 0 12px;min-height:19px}
#gate input{width:100%;padding:13px 15px;border-radius:11px;border:1px solid rgba(140,200,210,.28);
      background:rgba(255,255,255,.055);color:#eaf6f7;font-family:var(--mono);font-size:15px;
      text-align:center;letter-spacing:.08em;outline:none}
#gate input::placeholder{color:#6f979d;letter-spacing:0}
#gate input:focus{border-color:#57c7d6;box-shadow:0 0 0 3px rgba(87,199,214,.18)}
#gate button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:11px;cursor:pointer;
      background:linear-gradient(120deg,#3ea9bb,#0f6d7c);color:#f2fdff;font-weight:600;letter-spacing:.04em}
#gate button:hover{filter:brightness(1.08)}
#gate .err{color:#ffb2a8}
#gate .foot{margin-top:26px;font-size:11px;color:#5d848a;line-height:1.7}
#gate .hint{margin-top:14px;font-size:11.5px;color:#7ea7ad;font-family:var(--mono);
      border-top:1px solid rgba(140,200,210,.16);padding-top:12px}

/* ── 셸 ─────────────────────────────────── */
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--rule)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:56px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand .logo{font-family:var(--disp);font-weight:700;letter-spacing:.14em;font-size:15px;color:var(--ink)}
.brand .office{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.who .chip{padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);
      font-size:11px;font-weight:600}
.iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);
      cursor:pointer;line-height:1;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent-ink)}

nav.tabs{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:56px;z-index:29}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:11px 13px 9px;cursor:pointer;color:var(--muted);
      font-size:13.5px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink-2)}
nav.tabs button[aria-current="true"]{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}

main{padding:20px 0 56px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.sechead h2{font-size:16px}
.sechead .note{font-size:12px;color:var(--muted)}

/* ── 기간 선택 ───────────────────────────── */
.periodbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;
      color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--plane);font-weight:600}
.seg button:hover:not([aria-pressed="true"]){background:var(--accent-soft)}

/* ── 카드 ───────────────────────────────── */
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 17px;box-shadow:var(--shadow)}
.kpi .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--mono);font-weight:600;font-size:28px;letter-spacing:-.02em;margin-top:7px;line-height:1.1}
.kpi .val small{font-size:14px;font-weight:500;color:var(--ink-2);margin-left:3px;letter-spacing:0}
.kpi .sub{margin-top:6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.delta{font-family:var(--mono);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--good-ink)} .delta.dn{color:var(--crit-ink)} .delta.fl{color:var(--muted)}

.progress{height:6px;border-radius:99px;background:var(--grid);overflow:hidden;margin-top:11px}
.progress i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.progress i.s-good{background:var(--good)} .progress i.s-warn{background:var(--warn)}
.progress i.s-crit{background:var(--crit)}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;
      font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.good{background:rgba(12,163,12,.12);color:var(--good-ink);border-color:rgba(12,163,12,.25)}
.pill.warn{background:rgba(250,178,25,.15);color:#8a6100;border-color:rgba(250,178,25,.35)}
:root[data-theme="dark"] .pill.warn{color:#fcc75a}
.pill.crit{background:rgba(208,59,59,.12);color:var(--crit-ink);border-color:rgba(208,59,59,.28)}
.pill.neutral{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.warn{color:#fcc75a}}

/* ── 차트 ───────────────────────────────── */
.chartwrap{overflow-x:auto}
svg.chart{display:block;width:100%;height:auto;font-family:var(--sans)}
svg.chart text{fill:var(--muted);font-size:11px}
svg.chart .axis{stroke:var(--rule)}
svg.chart .gl{stroke:var(--grid);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend i.line{height:3px;border-radius:2px;width:16px}

#tip{position:fixed;z-index:80;pointer-events:none;opacity:0;transition:opacity .1s;
     background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:9px 11px;
     box-shadow:0 10px 30px -12px rgba(0,0,0,.45);font-size:12px;min-width:130px}
#tip .t{font-weight:600;margin-bottom:5px;font-size:12.5px}
#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink-2)}
#tip .r b{font-family:var(--mono);font-weight:600;color:var(--ink)}
#tip .r i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}

/* ── 랭킹 바 ────────────────────────────── */
.rank{display:flex;flex-direction:column;gap:9px}
.rank .row{display:grid;grid-template-columns:minmax(96px,auto) 1fr minmax(74px,auto);align-items:center;gap:11px}
.rank .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .track{height:19px;border-radius:5px;background:var(--grid);position:relative;overflow:hidden}
.rank .track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.rank .track .goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2);opacity:.55}
.rank .v{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}

/* ── 표 ─────────────────────────────────── */
.tablewrap{overflow:auto;max-height:560px;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;text-align:right;padding:9px 11px;
      font-size:11.5px;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
thead th:first-child,thead th.l{text-align:left}
thead th:hover{color:var(--accent-ink)}
thead th .ar{opacity:.5;font-size:9px;margin-left:3px}
tbody td{padding:8px 11px;border-bottom:1px solid var(--grid);text-align:right;
      font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td:first-child,tbody td.l{text-align:left;white-space:normal}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono)}
.sub2{font-size:11px;color:var(--muted)}
.searchrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
input.search,select.sel{padding:8px 11px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);
      color:var(--ink);font-family:var(--sans);font-size:13px;outline:none}
input.search:focus,select.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.search{flex:1;min-width:180px}

/* ── 담당자 카드 ────────────────────────── */
.repgrid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
@media (min-width:900px){.repgrid{grid-template-columns:repeat(3,1fr)}}
.prodgrid{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.repcard{cursor:pointer;transition:border-color .12s, transform .12s}
.repcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.repcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.repcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:nowrap}
.repcard .nm{font-size:15px;font-weight:600;white-space:nowrap}
.repcard .big{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:9px}

.two{display:grid;gap:12px;grid-template-columns:1fr;align-items:start}
@media (min-width:880px){ .two{grid-template-columns:1fr 1fr} .two.wide{grid-template-columns:1.45fr 1fr} }

.notice{background:var(--surface-2);border:1px solid var(--rule);border-left:3px solid var(--accent);
      border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink-2)}
.steps{counter-reset:st;display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:st;content:counter(st,decimal-leading-zero);font-family:var(--mono);
      font-size:11px;color:var(--accent-ink);background:var(--accent-soft);border-radius:7px;
      height:26px;display:grid;place-items:center;font-weight:600}
.steps b{display:block;font-weight:600;color:var(--ink);font-size:13.5px}
.steps p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--grid);
     border-radius:5px;padding:1px 5px}
footer.foot{border-top:1px solid var(--rule);padding:18px 0 30px;font-size:11.5px;color:var(--muted);line-height:1.8}
.demoflag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
     background:rgba(250,178,25,.16);border:1px solid rgba(250,178,25,.4);color:#8a6100;font-size:11px;font-weight:600}
:root[data-theme="dark"] .demoflag{color:#fcc75a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .demoflag{color:#fcc75a}}
/* ── 가군 강조 ──────────────────────────── */
.card.ga{border-color:color-mix(in srgb,var(--accent) 38%,var(--rule));
      background:linear-gradient(180deg,var(--accent-soft),transparent 62%),var(--surface)}
.card.ga .label{color:var(--accent-ink)}

/* ── 진척 스트립 ────────────────────────── */
.strip{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));padding:0}
.strip .st{padding:14px 17px;border-left:1px solid var(--grid)}
.strip .st:first-child{border-left:0}
.strip .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.strip .sv{font-family:var(--mono);font-weight:600;font-size:20px;margin-top:5px;line-height:1.15}
.strip .sv small{font-size:12px;color:var(--ink-2);margin-left:2px}
@media (max-width:640px){.strip .st{border-left:0;border-top:1px solid var(--grid)}
  .strip .st:first-child{border-top:0}}

/* ── 담당자 카드 보조행 ─────────────────── */
.repcard .ord{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;
      background:var(--accent-soft);color:var(--accent-ink);font-family:var(--mono);font-size:10.5px;
      font-weight:600;margin-right:6px;vertical-align:1px}
.minirow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;
      font-size:12px;color:var(--muted);white-space:nowrap}
.minirow b{font-family:var(--mono);font-weight:600;color:var(--ink-2);font-size:12px}

/* ── 토글 버튼 ──────────────────────────── */
.toggle{padding:8px 13px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);
      color:var(--ink-2);cursor:pointer;font-size:13px;white-space:nowrap}
.toggle:hover{border-color:var(--accent);color:var(--accent-ink)}
.toggle.on{background:var(--crit);border-color:var(--crit);color:#fff;font-weight:600}

/* ── 지표 정의 목록 ─────────────────────── */
.defs{display:flex;flex-direction:column;gap:8px}
.def{display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:12px;align-items:baseline;
     font-size:12.5px;padding-bottom:8px;border-bottom:1px solid var(--grid)}
.def:last-child{border-bottom:0;padding-bottom:0}
.def b{font-weight:600;color:var(--ink)}
.def span{color:var(--ink-2)}

/* 수익군 칩 */
.gchip{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-left:5px;
   border-radius:5px;font-size:10.5px;font-weight:700;vertical-align:1px;font-family:var(--sans)}
.gchip.g1{background:var(--accent);color:var(--plane)}
.gchip.g2{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-ink);
   border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
/* 등급 배지 */
.grade{display:inline-grid;place-items:center;min-width:30px;height:23px;padding:0 8px;border-radius:7px;
   font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.02em}
.grade.gS{background:var(--good);color:#fff}
.grade.gA{background:color-mix(in srgb,var(--good) 24%,transparent);color:var(--good-ink)}
.grade.gB{background:var(--accent-soft);color:var(--accent-ink)}
.grade.gC{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit-ink)}
/* AI 분석 인사이트 */
.aibox{background:linear-gradient(160deg,var(--accent-soft),transparent 70%),var(--surface);
  border:1px solid color-mix(in srgb,var(--accent) 32%,var(--rule));border-left:3px solid var(--accent);
  border-radius:14px;padding:15px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.aihd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.aichip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  background:var(--accent);color:var(--plane);font-size:11px;font-weight:700;letter-spacing:.02em}
.aichip::before{content:'◆';font-size:9px;opacity:.85}
.aisum{margin:0;font-size:13.5px;line-height:1.72;color:var(--ink)}
.aisum b{font-weight:600;color:var(--accent-ink)}
.aiacts{margin-top:13px;padding-top:12px;border-top:1px dashed color-mix(in srgb,var(--accent) 35%,transparent)}
.aiacts ul{margin:7px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.aiacts li{position:relative;padding-left:20px;font-size:13px;color:var(--ink-2);line-height:1.6}
.aiacts li::before{content:'→';position:absolute;left:0;top:0;color:var(--accent);font-weight:700}
.aiacts li b{color:var(--ink);font-weight:600}

/* 고찰 카드 */
.insgrid{grid-template-columns:1fr}
@media (min-width:900px){.insgrid{grid-template-columns:repeat(3,1fr)}}
.card.ins{border-top:3px solid var(--rule)}
.card.ins.good{border-top-color:var(--good)}
.card.ins.bad{border-top-color:var(--crit)}
.card.ins.next{border-top-color:var(--accent)}
.card.ins .sechead{margin-bottom:10px}
.card.ins .sechead h2{font-size:14px}
.card.ins.good .sechead h2{color:var(--good-ink)}
.card.ins.bad .sechead h2{color:var(--crit-ink)}
.card.ins.next .sechead h2{color:var(--accent-ink)}
.inslist{list-style:none;margin:0;padding:0;counter-reset:ins;display:flex;flex-direction:column;gap:11px}
.inslist li{display:grid;grid-template-columns:20px 1fr;gap:9px;align-items:start}
.inslist li::before{counter-increment:ins;content:counter(ins);font-family:var(--mono);font-size:10px;
   font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--grid);
   border-radius:5px;height:20px;display:grid;place-items:center}
.inslist b{display:block;font-size:13px;font-weight:600;line-height:1.4}
.inslist p{margin:3px 0 0;font-size:12px;color:var(--ink-2);line-height:1.55}

/* 기준선 스케일 */
.crit{padding:9px 4px 3px}
.ct{position:relative;height:4px;border-radius:99px;background:var(--grid);min-width:130px;margin:0 10px}
.cm{position:absolute;top:-3px;transform:translateX(-50%);text-align:center}
.cm i{display:block;width:1px;height:10px;background:var(--rule);margin:0 auto}
.cm b{display:block;font-family:var(--mono);font-size:8.5px;color:var(--muted);font-weight:600;margin-top:1px}
.cv{position:absolute;top:-4px;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;
    background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}

/* 등급 분포 */
.distrow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.dcell{display:flex;flex-direction:column;align-items:center;gap:5px;opacity:.35}
.dcell.on{opacity:1}
.dcell .dn{font-family:var(--mono);font-weight:600;font-size:15px}
.dcell .dn span{font-size:10px;color:var(--muted);margin-left:2px;font-weight:400}
.dcell .db{width:100%;height:40px;background:var(--grid);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.dcell .db i{display:block;width:100%;background:var(--accent);border-radius:6px;min-height:2px}
.dcell:not(.on) .db{background:transparent;border:1px dashed var(--grid)}

/* 회사 표준 3행 표 */
table.std td.grp{font-weight:600}
table.std tr.gna td{background:var(--accent-soft)}
table.std tr.sep td{border-top:2px solid var(--rule)}
td.pos{color:var(--good-ink)} td.neg{color:var(--crit-ink)}
tbody td .pill{font-size:10.5px;padding:1px 7px}
tbody td.l .pill{margin:1px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){
  .kpi .val{font-size:24px}
  .topbar .wrap{gap:9px}
  .brand .office{display:none}
}
</style>
</head>

<div id="gate">
  <div class="box">
    <div class="mark"></div>
    <h1>HB3 SCOPE</h1>
    <div class="sub">병원부산3사무소 · 성과관리 플랫폼</div>
    <div class="msg" id="_m">사번 뒤 7자리를 입력해 주세요 <span style="opacity:.6">(앞 120 제외)</span></div>
    <input id="pw" inputmode="numeric" autocomplete="off" placeholder="사번 뒤 7자리" aria-label="사번">
    <button id="go" type="button">접 속</button>
    <div class="foot">대웅제약 병원본부 지방1사업부 내부용<br>데이터 기준 2026년 7월 마감 · 가군 MBO 품목</div>
  </div>
</div>

  <header class="topbar">
    <div class="wrap">
      <div class="brand">
        <span class="logo">HB3 SCOPE</span>

      </div>

      <div class="who"><span class="chip" id="whoChip"></span><span id="whoName"></span></div>
      <button class="iconbtn" id="themeBtn" type="button" title="화면 밝기 전환" aria-label="화면 밝기 전환">◐</button>
      <button class="iconbtn" id="outBtn" type="button" title="접속 해제" aria-label="접속 해제">⏻</button>
    </div>
  </header>

  <nav class="tabs"><div class="wrap" id="tabs"></div></nav>

  <main><div class="wrap" id="view"></div></main>

    <span id="srcflag"></span>
    <span id="srcnote"></span>
  </div></footer>

/* ── 사번 인증 (평문 사번은 파일에 저장하지 않음 · SHA-256 대조) ── */
function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a))}
 var mp=Math.pow,mw=mp(2,32),res='',w=[],abl=ascii.length*8,
 h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,ic={},i,j;
 for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;
   h[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0;}}
 ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return;w[i>>2]|=j<<((3-i)%4)*8;}
 w[w.length]=((abl/mw)|0);w[w.length]=(abl);
 for(j=0;j<w.length;){var ww=w.slice(j,j+=16),oh=h;h=h.slice(0,8);
  for(i=0;i<64;i++){var w15=ww[i-15],w2=ww[i-2],a=h[0],e=h[4],
   t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]
     +(ww[i]=(i<16)?ww[i]:(ww[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+ww[i-7]
     +(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0),
   t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
   h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;}
  for(i=0;i<8;i++)h[i]=(h[i]+oh[i])|0;}
 for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(h[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16);}
 return res;}
function findUser(id){
  var hx = sha256(SALT + String(id).trim());
  for(var i=0;i<USERS.length;i++) if(USERS[i].h===hx) return USERS[i];
  return null;
}

/* ── 계산 도우미 ──────────────────────────────── */
function range(n){ var a=[];for(var i=0;i<n;i++)a.push(i);return a; }
function months(){ return S.period==='ytd' ? range(M) : [S.period]; }
function periodLabel(){ return S.period==='ytd' ? (REAL? '1~'+M+'월 월평균' : '1~'+M+'월 누적') : DATA.months[S.period]; }
function scoped(){
  if(S.user && S.user.r!=='office') return AC.filter(function(a){return a[3]===S.user.r});
  return AC;
}
function carried(a,p){ return a[10][p]>=0; }
function startOf(a,p){ return a[10][p]; }          /* -1 미취급 · 0 기존 · ≥1 2026 개시월 */
function statusOf(a,p){ return (a[11]? a[11][p] : -1); }
function baseMonth(list){ var t=0;
  list.forEach(function(x){ for(var p=0;p<NP;p++) t+=x[7][p][0]; }); return t; }
function h2Target(list){ var t=0;
  list.forEach(function(x){ for(var m=6;m<12;m++) t+=x[8][m]; }); return t; }
function covCount(a){ var c=0;for(var p=0;p<NP;p++) if(carried(a,p)) c++; return c; }
function accSum(a, arr, ms){ var t=0;
  for(var p=0;p<NP;p++) for(var i=0;i<ms.length;i++) t+=a[arr][p][ms[i]]; return t; }
function accSumP(a, arr, ps, ms){ var t=0;
  for(var j=0;j<ps.length;j++) for(var i=0;i<ms.length;i++) t+=a[arr][ps[j]][ms[i]]; return t; }
function accTgt(a, ms){ var t=0;for(var i=0;i<ms.length;i++)t+=a[8][ms[i]];return t; }
function accTgt12(a){ var t=0;for(var i=0;i<a[8].length;i++)t+=a[8][i];return t; }
function accProd(a, arr, p, ms){ var t=0;for(var i=0;i<ms.length;i++)t+=a[arr][p][ms[i]];return t; }
function accMonthly(a){ var r=[];
  for(var m=0;m<M;m++){ var v=0; for(var p=0;p<NP;p++) v+=a[6][p][m]; r.push(v); } return r; }

function agg(list, ms){
  var o={cur:0,prev:0,tgt:0,tgt12:0,gna:0,gnaPrev:0,gaS:0,gaP:0,naS:0,naP:0,
         prod:[],prodPrev:[],prodAcc:[],rep:[],repPrev:[],repTgt:[],repGna:[],repGnaPrev:[],
         direct:0,indirect:0,dAcc:0,cov:0,covMax:0,newAcc:0,newStart:0};
  for(var p=0;p<NP;p++){o.prod.push(0);o.prodPrev.push(0);o.prodAcc.push(0);}
  for(var r=0;r<NR;r++){o.rep.push(0);o.repPrev.push(0);o.repTgt.push(0);o.repGna.push(0);o.repGnaPrev.push(0);}
  list.forEach(function(a){
    var c=accSum(a,6,ms), pv=accSum(a,7,ms), tg=accTgt(a,ms);
    var g=accSumP(a,6,GNA,ms), gp=accSumP(a,7,GNA,ms);
    o.cur+=c; o.prev+=pv; o.tgt+=tg; o.tgt12+=accTgt12(a); o.gna+=g; o.gnaPrev+=gp;
    o.gaS+=accSumP(a,6,GA,ms); o.gaP+=accSumP(a,7,GA,ms);
    o.naS+=accSumP(a,6,NA,ms); o.naP+=accSumP(a,7,NA,ms);
    o.rep[a[3]]+=c; o.repPrev[a[3]]+=pv; o.repTgt[a[3]]+=tg;
    o.repGna[a[3]]+=g; o.repGnaPrev[a[3]]+=gp;
    if(a[4]){o.direct+=c;o.dAcc++;} else o.indirect+=c;
    o.cov+=covCount(a); o.covMax+=NP;
    if(a[9]>=0) o.newAcc++;
    for(var p=0;p<NP;p++){
      o.prod[p]+=accProd(a,6,p,ms); o.prodPrev[p]+=accProd(a,7,p,ms);
      if(carried(a,p)) o.prodAcc[p]++;
      if(startOf(a,p)>=1) o.newStart++;
    }
  });
  return o;
}
function monthly(list){
  var c=[],pv=[],tg=[],dr=[],ga=[],gaP=[],na=[],naP=[];
  for(var m=0;m<M;m++){c.push(0);pv.push(0);tg.push(0);dr.push(0);ga.push(0);gaP.push(0);na.push(0);naP.push(0);}
  list.forEach(function(a){
    for(var m=0;m<M;m++){
      var v=0,w=0; for(var p=0;p<NP;p++){ v+=a[6][p][m]; w+=a[7][p][m]; }
      c[m]+=v; pv[m]+=w; tg[m]+=a[8][m]; if(a[4]) dr[m]+=v;
      for(var j=0;j<GA.length;j++){ ga[m]+=a[6][GA[j]][m]; gaP[m]+=a[7][GA[j]][m]; }
      for(var j2=0;j2<NA.length;j2++){ na[m]+=a[6][NA[j2]][m]; naP[m]+=a[7][NA[j2]][m]; }
    }
  });
  var gna=[],gnaP=[];
  for(var m2=0;m2<M;m2++){ gna.push(ga[m2]+na[m2]); gnaP.push(gaP[m2]+naP[m2]); }
  return {cur:c,prev:pv,tgt:tg,direct:dr,ga:ga,gaPrev:gaP,na:na,naPrev:naP,gna:gna,gnaPrev:gnaP};
}
/* 분기·연간 진척 */
function progress(list){
  var q = Math.floor((M-1)/3), qs=q*3, qe=qs+3;          /* 진행 중인 분기 */
  var cur=0,tgtQ=0,tgt12=0,ytd=0;
  list.forEach(function(a){
    for(var m=qs;m<Math.min(qe,M);m++) for(var p=0;p<NP;p++) cur+=a[6][p][m];
    for(var m2=qs;m2<qe;m2++) tgtQ+=a[8][m2];
    tgt12+=accTgt12(a);
    ytd+=accSum(a,6,range(M));
  });
  return {q:q+1, qCur:cur, qTgt:tgtQ, qRate:tgtQ?cur/tgtQ*100:0,
          yRate:tgt12?ytd/tgt12*100:0, yTgt:tgt12, ytd:ytd,
          pace:(M/12)*100, need:Math.max(0,tgt12-ytd)};
}
function yearSeries(list){
  var y24=[],y25=[],y26=[];
  for(var m=0;m<12;m++){ y24.push(0); y25.push(0); }
  for(var m2=0;m2<M;m2++) y26.push(0);
  list.forEach(function(a){
    for(var p=0;p<NP;p++){
      for(var m=0;m<12;m++){ y25[m]+=a[7][p][m]; if(a[12]) y24[m]+=a[12][p][m]; }
      for(var m3=0;m3<M;m3++) y26[m3]+=a[6][p][m3];
    }
  });
  return {y24:y24,y25:y25,y26:y26};
}

/* 회사 표준 양식 — 기준1: 25년 월평균 vs 26년 월평균 / 기준2: 동기간 누적 */
function band(list, ps){
  var p12=0, pN=0, c=0;
  list.forEach(function(a){
    for(var j=0;j<ps.length;j++){ var p=ps[j];
      for(var m=0;m<a[7][p].length;m++) p12+=a[7][p][m];
      for(var m2=0;m2<M;m2++){ c+=a[6][p][m2]; pN+=a[7][p][m2]; }
    }
  });
  var pAvg=p12/12, cAvg=c/M;
  return {pAvg:pAvg, cAvg:cAvg, avgGr:pAvg>0?(cAvg/pAvg-1)*100:0,
          pSum:pN, cSum:c, pAvgN:pN/M, cAvgN:c/M,
          sumGr:pN>0?(c/pN-1)*100:0,
          delta:cAvg-pAvg,          /* 월평균 성장금액 (기준점 대비) */
          deltaSum:c-pN};
}

/* 위험 신호 */
function risks(a){
  var f=[], mo=accMonthly(a), ms=range(M);
  var c=accSum(a,6,ms), pv=accSum(a,7,ms), tg=accTgt(a,ms);
  if(M>=4 && mo[M-1]<mo[M-2] && mo[M-2]<mo[M-3] && mo[M-3]<mo[M-4]) f.push('3개월↓');
  if(!REAL && pv>0 && c<pv) f.push('역성장');
  if(REAL){ var bb=band([a],range(NP)); if(bb.pAvg>0 && bb.avgGr<-10) f.push('기준점 -10%↓'); }
  else if(tg>0 && c/tg*100<90) f.push('달성 90%↓');
  if(REAL){
    var stop=0; for(var p=0;p<NP;p++){ var s=statusOf(a,p); if(s===2||s===3) stop++; }
    if(stop>=5) f.push('중단·이탈 '+stop+'종');
  } else {
    for(var j=0;j<GA.length;j++){ var p2=GA[j];
      if(startOf(a,p2)===0 && a[6][p2][M-1]===0 && a[6][p2][M-2]===0) f.push(DATA.products[p2]+' 중단');
    }
  }
  return f;
}

function nf(v,d){ d=d||0; return (v||0).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function eok(v){ return (v/100).toFixed(1); }
function pcs(v){ return (v>=0?'+':'')+v.toFixed(1)+'%'; }
function sgn(v){ return (v>=0?'+':'')+nf(v); }
function growth(c,p){ return p>0 ? (c/p-1)*100 : 0; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]}); }
function deltaTag(v){
  var cls = v>0.5?'up':(v<-0.5?'dn':'fl'), ar = v>0.5?'▲':(v<-0.5?'▼':'—');
  return '<span class="delta '+cls+'">'+ar+' '+Math.abs(v).toFixed(1)+'%</span>';
}
function grCell(c,p){
  if(p<=0) return c>0 ? '<span class="pill neutral">신규</span>' : '<span class="sub2">—</span>';

}
var GRADES=['S','A+','A','B+','B','C+','C'];
function gradeOf(grPct, tbl){

}
function gradeCls(g){ return g==='S'?'gS':(g.charAt(0)==='A'?'gA':(g.charAt(0)==='B'?'gB':'gC')); }
function gradeBadge(g){ return '<span class="grade '+gradeCls(g)+'">'+g+'</span>'; }
function rateClass(r){ r=Math.round(r*10)/10; return r>=100?'s-good':(r>=95?'':(r>=90?'s-warn':'s-crit')); }
function ratePill(r){
  r=Math.round(r*10)/10;

function riskPills(f){

/* ── 차트 ─────────────────────────────────────── */
function niceMax(v){
  if(v<=0) return 10;
  var e=Math.pow(10,Math.floor(Math.log10(v))), f=v/e;
  var m = f<=1?1:f<=1.2?1.2:f<=1.5?1.5:f<=2?2:f<=2.5?2.5:f<=3?3:f<=4?4:f<=5?5:f<=6?6:f<=8?8:10;
  return m*e;
}
function comboChart(labels, series, lineS, opt){
  opt=opt||{};
  var W=opt.W||720,H=opt.h||250,L=46,R=14,T=16,B=30, iw=W-L-R, ih=H-T-B;
  var maxv=0;
  series.forEach(function(s){s.values.forEach(function(v){if(v>maxv)maxv=v})});
  if(lineS) lineS.values.forEach(function(v){if(v>maxv)maxv=v});
  maxv=niceMax(maxv);
  var n=labels.length, band=iw/n, gw=band*0.62, bw=gw/series.length;
  var y=function(v){return T+ih-(v/maxv)*ih};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(opt.aria||'월별 추이')+'">';
  for(var t=0;t<=4;t++){ var vv=maxv*t/4, yy=y(vv);
    s+='<line class="gl" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/>';
    s+='<text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+nf(vv)+'</text>'; }
  for(var i=0;i<n;i++){
    var bx=L+band*i+(band-gw)/2;
    series.forEach(function(se,si){
      var v=se.values[i], hgt=Math.max(1,(v/maxv)*ih);
      s+='<rect x="'+(bx+bw*si+1)+'" y="'+y(v)+'" width="'+(bw-2)+'" height="'+hgt+'" rx="3" fill="'+se.color+'"/>';
    });
    s+='<text x="'+(L+band*i+band/2)+'" y="'+(H-10)+'" text-anchor="middle">'+labels[i]+'</text>';
  }
  if(lineS){
    var pts=lineS.values.map(function(v,i){return (L+band*i+band/2)+','+y(v)}).join(' ');
    s+='<polyline points="'+pts+'" fill="none" stroke="'+lineS.color+'" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>';
    lineS.values.forEach(function(v,i){
      s+='<circle cx="'+(L+band*i+band/2)+'" cy="'+y(v)+'" r="3.4" fill="var(--surface)" stroke="'+lineS.color+'" stroke-width="2"/>';
    });
  }
  s+='<line class="axis" x1="'+L+'" y1="'+(T+ih)+'" x2="'+(W-R)+'" y2="'+(T+ih)+'"/>';
  for(var i2=0;i2<n;i2++)
    s+='<rect class="hit" data-i="'+i2+'" x="'+(L+band*i2)+'" y="'+T+'" width="'+band+'" height="'+ih+'" fill="transparent"/>';
  return s+'</svg>';
}
function lineChart(labels, series, opt){
  opt=opt||{};
  var W=opt.W||720,H=opt.h||250,L=opt.L||46,R=opt.R||64,T=16,B=30, iw=W-L-R, ih=H-T-B;
  var maxv=0, minv=opt.zero===false?Infinity:0;
  series.forEach(function(s){s.values.forEach(function(v){if(v>maxv)maxv=v;if(v<minv)minv=v})});
  if(opt.zero===false){ var pad=(maxv-minv)*0.2||1; minv=Math.max(0,minv-pad); maxv=maxv+pad; }
  else maxv=niceMax(maxv);
  var n=labels.length, step=iw/(n-1||1);
  var y=function(v){return T+ih-((v-minv)/((maxv-minv)||1))*ih};
  var fmt=opt.fmt||function(v){return nf(v)};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(opt.aria||'추이')+'">';
  for(var t=0;t<=4;t++){ var vv=minv+(maxv-minv)*t/4, yy=y(vv);
    s+='<line class="gl" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/>';
    s+='<text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+fmt(vv)+'</text>'; }
  var ends=series.map(function(se,si){return {si:si,y:y(se.values[(se.len||se.values.length)-1])}})
                 .sort(function(a,b){return a.y-b.y});
  for(var q=1;q<ends.length;q++) if(ends[q].y-ends[q-1].y<13) ends[q].y=ends[q-1].y+13;
  var endY={}; ends.forEach(function(e){endY[e.si]=e.y});
  series.forEach(function(se,sidx){
    var lenS = se.len || se.values.length;
    var pts=se.values.slice(0,lenS).map(function(v,i){return (L+step*i)+','+y(v)}).join(' ');
    if(se.area)
      s+='<path d="M'+L+','+y(se.values[0])+' L'+pts.split(' ').join(' L')+' L'+(L+step*(lenS-1))+','+(T+ih)+' L'+L+','+(T+ih)+' Z" fill="'+se.color+'" opacity="0.10"/>';
    s+='<polyline points="'+pts+'" fill="none" stroke="'+se.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    var lx=L+step*(lenS-1), ly=y(se.values[lenS-1]);
    s+='<circle cx="'+lx+'" cy="'+ly+'" r="4" fill="'+se.color+'" stroke="var(--surface)" stroke-width="2"/>';
    if(se.endLabel!==false){
      var ty=endY[sidx];
      if(Math.abs(ty-ly)>2)
        s+='<path d="M'+(lx+4)+','+ly+' L'+(lx+7)+','+ty+'" stroke="'+se.color+'" stroke-width="1" fill="none" opacity=".5"/>';
      s+='<text x="'+(lx+9)+'" y="'+(ty+4)+'" fill="'+se.color+'" font-size="11" font-weight="600">'+esc(se.name)+'</text>';
    }
  });
  s+='<line class="axis" x1="'+L+'" y1="'+(T+ih)+'" x2="'+(W-R)+'" y2="'+(T+ih)+'"/>';
  labels.forEach(function(lb,i){ s+='<text x="'+(L+step*i)+'" y="'+(H-10)+'" text-anchor="middle">'+lb+'</text>'; });
  for(var i2=0;i2<n;i2++)
    s+='<rect class="hit" data-i="'+i2+'" x="'+(L+step*i2-step/2)+'" y="'+T+'" width="'+step+'" height="'+ih+'" fill="transparent"/>';
  return s+'</svg>';
}
function sparkline(vals,color){
  var W=76,H=20,mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals),rg=(mx-mn)||1;
  var pts=vals.map(function(v,i){return (i/(vals.length-1)*W)+','+(H-2-((v-mn)/rg)*(H-4))}).join(' ');
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+
    '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round"/></svg>';
}
function legend(items){

  }).join('')+'</div>';

  if(S.rep===null){
    h+='<div class="notice">담당자 카드를 선택하면 담당 거래처·제품 믹스·월별 추이를 볼 수 있습니다. 카드는 목표 달성률 순입니다.</div>';

  var mine=AC.filter(function(x){return x[3]===S.rep});
  var ra=agg(mine,ms), rm=monthly(mine), rp=progress(mine);

  if(REAL){

    h+=statStrip([

      {k:'성장금액 (월평균)', v:sgn(rb.delta)+'<small>백만</small>', s:'누계 월평균 '+nf(rb.cAvg,1)+' · 기준점 '+nf(rb.pAvg,1)},

      {k:'취급 품목', v:ra.cov+'<small>건</small>', s:mine.length+'개 거래처 · 커버리지 '+(ra.covMax?ra.cov/ra.covMax*100:0).toFixed(1)+'%'}
    ]);
  } else
  h+=statStrip([
    {k:'달성률', v:rt.toFixed(1)+'<small>%</small>', bar:rt, cls:rateClass(rt), s:'목표 '+nf(ra.tgt)},
    {k:'전년비', v:(growth(ra.cur,ra.prev)>=0?'+':'')+growth(ra.cur,ra.prev).toFixed(1)+'<small>%</small>', s:'증감 '+sgn(ra.cur-ra.prev)},
    {k:'가군 성장금액', v:sgn(ra.gna-ra.gnaPrev), s:'가군 실적 '+nf(ra.gna)+' ('+(ra.cur?ra.gna/ra.cur*100:0).toFixed(1)+'%)'},
    {k:'연간 진척률', v:rp.yRate.toFixed(1)+'<small>%</small>', bar:rp.yRate, cls:rp.yRate>=rp.pace?'s-good':'s-warn', s:'기간 경과 '+rp.pace.toFixed(1)+'%'}
  ]);
  h+='<div class="two wide" style="margin-top:12px">';
  h+='<div class="card"><div class="sechead"><h2>'+DATA.reps[S.rep]+' · 월별 추이</h2></div>'+
     '<div class="chartwrap" id="c2">'+comboChart(DATA.months,
        [{name:'2026 실적',color:cvar('--s1'),values:rm.cur},{name:'2025 실적',color:cvar('--s3'),values:rm.prev}],
        {name:'2026 목표',color:'var(--ink-2)',values:rm.tgt})+'</div>'+
     legend([{name:'2026 실적',color:cvar('--s1')},{name:'2025 실적',color:cvar('--s3')},{name:'2026 목표',color:'var(--ink-2)',line:true}])+'</div>';
  var pr=DATA.products.map(function(p,i){
    return {name:p+gSuf(i),v:ra.prod[i]/M,color:NP>12?cvar('--s1'):cvar(SC[i]),
      right:nf(ra.prod[i]/M,1)+' <span class="sub2">'+ra.prodAcc[i]+'개소</span>'};
  }).sort(function(x,y){return y.v-x.v}).filter(function(x){return x.v>0});
  var prTop=pr.slice(0,12), prEtc=pr.slice(12);
  var prEtcV=prEtc.reduce(function(t,x){return t+x.v},0);
  h+='<div class="card"><div class="sechead"><h2>'+(NP>12?'상위 품목':'제품 믹스')+'</h2>'+
     '<span class="note">월평균 · 우측은 취급 거래처 수</span></div>'+rankBars(prTop)+
     (prEtc.length? '<div class="sub2" style="margin-top:10px">나머지 '+prEtc.length+'종 합계 <b>'+nf(prEtcV,1)+'</b></div>':'')+'</div>';
  h+='</div>';

  var rows=mine.map(function(ac){
    var c=accSum(ac,6,ms),p=accSum(ac,7,ms),t=accTgt(ac,ms);
    return {ac:ac,c:c,p:p,t:t,r:t?c/t*100:0,g:growth(c,p),f:risks(ac),
            ga:accSumP(ac,6,GNA,ms), gap:accSumP(ac,7,GNA,ms)};
  }).sort(function(x,y){return y.c-x.c});
  if(REAL){
    var ins=repInsights(S.rep);
    h+='<div class="sechead" style="margin:18px 0 10px"><h2>'+DATA.reps[S.rep]+' 고찰</h2>'+
       '<span class="note">1~'+M+'월 실적에서 자동 산출 · 매달 갱신됩니다</span></div>'+
       '<div class="grid insgrid">'+
       insightCard('잘한 점','good',ins.good,'이번 기간에 두드러진 항목이 없습니다.')+
       insightCard('부족한 점','bad',ins.bad,'특별히 걸리는 항목이 없습니다.')+
       insightCard('변화시켜야 할 점','next',ins.next,'—')+
       '</div>';
  }
  h+='<div class="card" style="margin-top:12px"><div class="sechead"><h2>담당 거래처 '+mine.length+'개소</h2>'+
     '<span class="note">'+periodLabel()+' · 백만원</span></div>'+
     '<div class="tablewrap"><table><thead><tr><th class="l">거래처</th><th class="l">유형</th>'+
     (REAL? '<th>기준점(월)</th><th>누계 월평균</th><th>'+DATA.months[M-1]+' 실적</th><th>성장금액(월)</th><th>성장률</th><th>등급</th><th class="l">신호</th>'
          : '<th>실적</th><th>달성률</th><th>전년비</th><th>가군</th><th>커버</th><th class="l">신호</th>')+'</tr></thead><tbody>'+
     rows.map(function(r){
       var bb=REAL? band([r.ac],range(NP)) : null;
       return '<tr><td class="l">'+esc(r.ac[1])+'<div class="sub2">'+(REAL?'코드 ':'')+esc(r.ac[5])+(r.ac[4]?' · 직거래':'')+'</div></td>'+
         '<td class="l"><span class="sub2">'+(r.ac[2]||'—')+'</span></td>'+

           ? '<td class="num sub2">'+nf(bb.pAvg,1)+'</td><td class="num">'+nf(bb.cAvg,1)+'</td>'+
             '<td class="num sub2">'+nf((function(){var t=0;for(var p=0;p<NP;p++)t+=r.ac[6][p][M-1];return t})(),1)+'</td>'+
             '<td class="num '+(bb.delta>=0?'pos':'neg')+'">'+sgn(bb.delta)+'</td>'+
             '<td class="num">'+deltaTag(bb.avgGr)+'</td>'+
             '<td>'+gradeBadge(gradeOf(bb.avgGr))+'</td>'
           : '<td class="num">'+nf(r.c)+'</td><td>'+ratePill(r.r)+'</td><td class="num">'+deltaTag(r.g)+'</td>'+
             '<td class="num">'+nf(r.ga)+'<div class="sub2">'+sgn(r.ga-r.gap)+'</div></td>'+
             '<td class="num sub2">'+covCount(r.ac)+'/'+NP+'</td>')+
         '<td class="l">'+riskPills(r.f)+'</td></tr>';
     }).join('')+'</tbody></table></div></div>';
  return h;
}

/* ── AI 분석 인사이트 (화면별 요약 + 할 일) ───────── */
/* ── 회사 공식 지표 집계 (기준점·최종실적·성장금액·성장률) ── */
function ofAgg(names, year, limit){
  if(!OF || !OF[String(year)]) return null;
  var Y=OF[String(year)], b=0, f=0, cnt=0;
  var mmax = (limit==null? 12 : limit);
  for(var m=0;m<mmax;m++){
    var any=false;
    for(var i=0;i<names.length;i++){
      var arr=Y[names[i]]; if(!arr) continue;
      var x=arr[m]; if(x && x[0]!=null){ b+=x[0]; f+=(x[1]||0); any=true; }
    }
    if(any) cnt++;
  }
  if(!cnt) return null;
  return {pAvg:b/cnt, cAvg:f/cnt, delta:(f-b)/cnt, avgGr:b? (f/b-1)*100 : 0,
          cSum:f, pSum:b, months:cnt, official:true};
}
function ofNames(idxs){ return idxs.map(function(i){return DATA.reps[i]}); }
function ofOffice(){ return ofAgg(ofNames(ACTIVE), DATA.year); }
function ofRep(i){ return ofAgg([DATA.reps[i]], DATA.year); }
function ofPrev(names, mcnt){ return ofAgg(names, DATA.year-1, mcnt); }
/* 공식값이 있으면 그것을, 없으면 계산값을 쓴다 */
function mainBand(list, repIdx){
  var o = (repIdx==null? ofOffice() : ofRep(repIdx));
  if(o){
    var pv = ofPrev(repIdx==null? ofNames(ACTIVE) : [DATA.reps[repIdx]], o.months);
    o.sumGr = (pv && pv.cAvg)? (o.cAvg/pv.cAvg-1)*100 : 0;
    o.pAvgN = pv? pv.cAvg : 0; o.cAvgN = o.cAvg;
    return o;
  }
  return band(list, range(NP));
}
function ofMonthly(names, year){
  var Y = OF && OF[String(year)]; var out=[];
  for(var m=0;m<12;m++){ var t=0, any=false;
    if(Y) for(var i=0;i<names.length;i++){ var arr=Y[names[i]]; if(!arr) continue;
      var x=arr[m]; if(x && x[1]!=null){ t+=x[1]; any=true; } }
    out.push(any? t : 0);
  }
  return out;
}

function bandMonth(list, m){ var t=0;
  list.forEach(function(a){ for(var p=0;p<NP;p++) t+=a[6][p][m]; }); return t; }
function aiBox(tab, list){
  if(!REAL) return '';
  var A_=(tab==='sum'||tab==='rep')? mainBand(list,(S.user.r==='office'?null:S.user.r)) : band(list,range(NP));
  var G_=band(list,GNA), grade=gradeOf(A_.avgGr);
  var accs=list.map(function(ac){ var b=band([ac],range(NP)); return {ac:ac,d:b.delta,c:b.cAvg,gr:b.avgGr}; });
  var dn=accs.filter(function(x){return x.d<0}).sort(function(x,y){return x.d-y.d});
  var up=accs.filter(function(x){return x.d>0}).sort(function(x,y){return y.d-x.d});
  var short=function(s){ return s.length>14? s.slice(0,14)+'…' : s; };
  var SS=[], T=[];

  if(tab==='sum'){
    var h2t=h2Target(list), gapM=Math.max(0, A_.pAvg*1.12 - A_.cAvg);
    SS.push('1~'+M+'월 <b>월평균 '+nf(A_.cAvg,1)+' 백만</b>으로 기준점 '+nf(A_.pAvg,1)+' 대비 <b>'+pcs(A_.avgGr)+'</b>('+grade+' 등급), 성장금액 월 '+sgn(A_.delta)+' 백만입니다. '+DATA.months[M-1]+' 단월은 '+nf((OF? (ofMonthly(ofNames(ACTIVE), DATA.year)[M-1]) : bandMonth(list,M-1)),1)+'입니다.');
    if(dn.length && up.length)
      SS.push('늘어난 거래처 '+up.length+'곳에서 월 '+sgn(up.reduce(function(t,x){return t+x.d},0))+', 줄어든 '+dn.length+'곳에서 월 '+sgn(dn.reduce(function(t,x){return t+x.d},0))+' — 감소가 성장을 '+(Math.abs(dn.reduce(function(t,x){return t+x.d},0))>up.reduce(function(t,x){return t+x.d},0)?'앞서고':'따라오고')+' 있습니다.');
    SS.push('가군은 월평균 '+nf(G_.cAvg,1)+' 백만으로 전체의 '+(A_.cAvg?G_.cAvg/A_.cAvg*100:0).toFixed(1)+'%, 성장금액 월 '+sgn(G_.delta)+' 백만입니다.');
    if(dn.length) T.push('<b>'+esc(short(dn[0].ac[1]))+'</b> 등 감소 상위 3곳이 월 '+sgn(dn.slice(0,3).reduce(function(t,x){return t+x.d},0))+' — 원인 확인이 가장 급합니다');
    if(gapM>0) T.push('B 등급(+12%)까지 월 <b>'+nf(gapM,1)+' 백만</b> 부족 — 남은 '+(12-M)+'개월 배분 필요');
    if(h2t>0){ var gaAvg=band(list,GA).cAvg;
      T.push('하반기 가군 MBO 목표 월 <b>'+nf(h2t/6,1)+' 백만</b> — 가군 누계 월평균 '+nf(gaAvg,1)+' 대비 '+pcs(gaAvg?(h2t/6/gaAvg-1)*100:0)+' 수준입니다');
    }
  }
  else if(tab==='eval' && EVAL){
    var o=EVAL.office, low=o.items.filter(function(x){return x.grade==='C'||x.grade==='C+'});
    var high=o.items.filter(function(x){return x.grade==='S'||x.grade==='A'});
    SS.push('종합 <b>'+o.overall['종합']+'점</b> (정량 '+o.overall['정량등급']+' · 정성 '+o.overall['정성등급']+'). 17개 항목 중 S·A가 '+high.length+'개, C·C+가 '+low.length+'개입니다.');
    if(high.length) SS.push('잘 나오는 항목: '+high.map(function(x){return esc(x.n)+'('+x.grade+')'}).join(' · ')+'.');
    if(low.length) SS.push('발목을 잡는 항목: '+low.map(function(x){return esc(x.n)+'('+x.grade+')'}).join(' · ')+'.');
    low.slice(0,3).forEach(function(x){
      var c=EVAL.crit[x.n]||EVAL.crit[x.n.replace(/\(.*\)/,'')];
      if(c && c.B!=null && x.v!=null)
        T.push('<b>'+esc(x.n)+'</b> 현재 '+nf(x.v,1)+(c.unit==='%'?'%':'')+' → B 기준 '+c.B+(c.unit==='%'?'%':'')+'까지 <b>'+nf(Math.abs(c.B-x.v),1)+(c.unit==='%'?'%p':' '+(c.unit||''))+'</b> 개선 필요');
      else T.push('<b>'+esc(x.n)+'</b> '+x.grade+' 등급 — 개선 계획이 필요합니다');
    });
  }
  else if(tab==='rep'){
    var rs=ACTIVE.map(function(i){ return {i:i, b:mainBand(AC.filter(function(x){return x[3]===i}), i)}; })
                 .sort(function(x,y){return y.b.avgGr-x.b.avgGr});
    SS.push('담당자 '+rs.length+'명의 기준점 대비 성장률은 '+pcs(rs[0].b.avgGr)+'('+DATA.reps[rs[0].i]+')부터 '+pcs(rs[rs.length-1].b.avgGr)+'('+DATA.reps[rs[rs.length-1].i]+')까지 <b>'+(rs[0].b.avgGr-rs[rs.length-1].b.avgGr).toFixed(1)+'%p</b> 벌어져 있습니다.');
    var plus=rs.filter(function(x){return x.b.delta>0}), minus=rs.filter(function(x){return x.b.delta<=0});
    SS.push('성장한 담당자 '+plus.length+'명이 월 '+sgn(plus.reduce(function(t,x){return t+x.b.delta},0))+', 역성장 '+minus.length+'명이 월 '+sgn(minus.reduce(function(t,x){return t+x.b.delta},0))+' 백만입니다.');
    if(minus.length) T.push('<b>'+minus.map(function(x){return DATA.reps[x.i]}).join(' · ')+'</b> — 카드를 눌러 고찰의 「변화시켜야 할 점」부터 함께 보세요');
    if(plus.length) T.push('<b>'+DATA.reps[plus[0].i]+'</b>의 성장 방식을 사무소 회의에서 공유 — 월 '+sgn(plus[0].b.delta)+' 백만');
    T.push('등급이 갈리는 지점은 성장률입니다. 담당자별 「B 등급까지 월 O백만」을 월간 목표로 잡아 주세요');
  }
  else if(tab==='acct'){
    var sorted=accs.slice().sort(function(x,y){return y.c-x.c});
    var top10=sorted.slice(0,10).reduce(function(t,x){return t+x.c},0);
    var risky=list.filter(function(x){return risks(x).length});
    SS.push('거래처 '+list.length+'곳 중 상위 10곳이 실적의 <b>'+(A_.cAvg?top10/A_.cAvg*100:0).toFixed(1)+'%</b>를 차지합니다(월평균 '+nf(top10,1)+' / '+nf(A_.cAvg,1)+' 백만). 집중도가 '+(top10/A_.cAvg>0.6?'높은':'보통인')+' 구조입니다.');
    SS.push('주의 신호가 걸린 곳은 '+risky.length+'곳이고, 그중 기준점 대비 10% 이상 빠진 곳이 '+list.filter(function(x){return band([x],range(NP)).avgGr<-10}).length+'곳입니다.');
    if(dn.length) T.push('감소 상위 3곳(<b>'+dn.slice(0,3).map(function(x){return esc(short(x.ac[1]))}).join(' · ')+'</b>)을 이번 달 방문 우선순위로');
    T.push('「주의 거래처만」 토글로 걸러 담당자와 1:1로 원인을 정리하세요');
    if(sorted.length) T.push('상위 거래처 <b>'+esc(short(sorted[0].ac[1]))+'</b>는 월평균 '+nf(sorted[0].c,1)+' 백만 — 흔들리면 사무소 전체가 흔들립니다. 방어 우선');
  }
  else if(tab==='prod'){
    var pr=range(NP).map(function(p){ var b=band(list,[p]); return {p:p,b:b}; }).filter(function(x){return x.b.cAvg>0});
    pr.sort(function(x,y){return y.b.cAvg-x.b.cAvg});
    var top10p=pr.slice(0,10).reduce(function(t,x){return t+x.b.cAvg},0);
    var drop=pr.filter(function(x){return x.b.delta<0}).sort(function(x,y){return x.b.delta-y.b.delta});
    var rise=pr.filter(function(x){return x.b.delta>0}).sort(function(x,y){return y.b.delta-x.b.delta});
    SS.push('품목 '+pr.length+'종 중 상위 10종이 실적의 <b>'+(A_.cAvg?top10p/A_.cAvg*100:0).toFixed(1)+'%</b>입니다(월평균 기준).');
    if(rise.length) SS.push('가장 많이 늘어난 품목은 '+esc(DATA.products[rise[0].p])+' '+sgn(rise[0].b.delta)+', 가장 많이 줄어든 품목은 '+esc(DATA.products[drop[0].p])+' '+sgn(drop[0].b.delta)+' 백만입니다.');
    if(drop.length) T.push('감소 상위 3품목(<b>'+drop.slice(0,3).map(function(x){return esc(DATA.products[x.p])}).join(' · ')+'</b>) 합계 월 '+sgn(drop.slice(0,3).reduce(function(t,x){return t+x.b.delta},0))+' — 어느 거래처에서 빠졌는지 추적');
    if(rise.length) T.push('<b>'+esc(DATA.products[rise[0].p])+'</b>가 되는 이유를 다른 거래처로 확산');
  }
  else if(tab==='ga'){
    var holders=list.filter(function(x){return GNA.some(function(p){return carried(x,p)})});
    var miss=list.length-holders.length;
    SS.push('가군 월평균 <b>'+nf(G_.cAvg,1)+' 백만</b>, 전체의 '+(A_.cAvg?G_.cAvg/A_.cAvg*100:0).toFixed(1)+'%. 기준점 대비 '+pcs(G_.avgGr)+'로 전체 성장률 '+pcs(A_.avgGr)+'보다 '+(G_.avgGr>=A_.avgGr?'높습니다':'낮습니다')+'.');
    SS.push('가군을 취급하는 거래처는 '+holders.length+'곳, 아직 없는 곳이 '+miss+'곳입니다.');
    T.push('가군은 수익률이 높은 품목군입니다. 같은 매출이면 가군 비중을 올리는 쪽이 이익률 평가에 유리합니다');
    if(miss) T.push('미취급 '+miss+'곳 중 실적 상위부터 코딩 협의 — 표 상단 순서대로');
    T.push('담당자별 가군 성장금액이 마이너스인 사람부터 품목 단위로 원인 확인');
  }
  else if(tab==='new'){
    var nC=0,sC=0,nV=0,sV=0;
    list.forEach(function(ac){ for(var p=0;p<NP;p++){ var st=statusOf(ac,p); if(st<0) continue;
      var b=band([ac],[p]);
      if(st===1||st===4){nC++; nV+=b.cAvg;} if(st===2||st===3){sC++; sV+=b.pAvg;} }});
    SS.push('신규·코딩 <b>'+nC+'건</b>으로 월평균 '+nf(nV,1)+' 백만을 만들었고, 중단·이탈 <b>'+sC+'건</b>으로 월평균 '+nf(sV,1)+' 백만이 빠졌습니다. 순증은 <b>월 '+sgn(nV-sV)+' 백만</b>입니다.');
    SS.push('품목 커버리지는 '+((function(){var c=0;list.forEach(function(x){c+=covCount(x)});return c/(list.length*NP)*100})()).toFixed(1)+'%로, 빈칸이 곧 확대 여지입니다.');
    T.push((nV-sV>=0? '순증이 플러스입니다. 이 흐름을 유지하려면 ':'이탈이 신규를 앞섭니다. 먼저 ')+'<b>중단·이탈 표 상위</b>부터 회복 대상을 지정하세요');
    T.push('신규 개시는 담당자별 편차가 큽니다. 많이 만든 담당자의 접근법을 공유');
    T.push('미코딩 많은 거래처 = 실적은 있는데 품목이 적은 곳. 크로스셀 1순위입니다');
  }
  if(!SS.length) return '';
  return '<div class="aibox"><div class="aihd"><span class="aichip">AI 분석 인사이트</span>'+
    '<span class="sub2">'+DATA.office+' · 1~'+M+'월 실적 기준 · 자동 산출</span></div>'+
    '<p class="aisum">'+SS.join(' ')+'</p>'+
    (T.length? '<div class="aiacts"><div class="eyebrow">지금 할 일</div><ul>'+
      T.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>':'')+'</div>';
}

/* ── 담당자 고찰 (데이터에서 자동 생성) ──────────── */
function nextGrade(gr){
  var g=gr/100, tbl=DATA.grade, order=['C','C+','B','B+','A','A+','S'];
  for(var i=0;i<order.length;i++){ if(g < tbl[order[i]]) return {g:order[i], need:tbl[order[i]]}; }
  return null;
}
function repInsights(i){
  var mine=AC.filter(function(x){return x[3]===i});
  var officeList=AC.filter(function(x){return ACTIVE.indexOf(x[3])>=0});
  var b=mainBand(mine, i), all=mainBand(officeList, null);
  var bg=band(mine,GNA);
  var good=[], bad=[], next=[];

  /* 거래처별 증감 */
  var accs=mine.map(function(ac){ var bb=band([ac],range(NP));
    return {ac:ac,d:bb.delta,gr:bb.avgGr,c:bb.cAvg}; });
  var up=accs.filter(function(x){return x.d>0}).sort(function(x,y){return y.d-x.d});
  var dn=accs.filter(function(x){return x.d<0}).sort(function(x,y){return x.d-y.d});
  var nm=function(x){return x.ac[1].length>16? x.ac[1].slice(0,16)+'…' : x.ac[1]};

  /* 품목 상태 */
  var newCells=[], stopCells=[];
  mine.forEach(function(ac){ for(var p=0;p<NP;p++){
    var st=statusOf(ac,p); if(st<0) continue;
    var bb=band([ac],[p]);
    if(st===1||st===4) newCells.push({ac:ac,p:p,v:bb.cAvg});
    if(st===2||st===3) stopCells.push({ac:ac,p:p,loss:bb.pAvg});
  }});
  var newSum=newCells.reduce(function(t,x){return t+x.v},0);
  var stopLoss=stopCells.reduce(function(t,x){return t+x.loss},0);

  /* 최근 추세 */
  var mo=monthly(mine), h1=0,h2=0,nh=Math.min(3,Math.floor(M/2));
  for(var k=0;k<nh;k++){ h2+=mo.cur[M-1-k]; h1+=mo.cur[M-1-nh-k]; }
  var trend = h1>0 ? (h2/h1-1)*100 : 0;

  /* 커버리지 */
  var cov=0, covMax=mine.length*NP; mine.forEach(function(x){cov+=covCount(x)});
  var covR=covMax? cov/covMax*100:0;
  var ocov=0, ocovMax=officeList.length*NP; officeList.forEach(function(x){ocov+=covCount(x)});
  var ocovR=ocovMax? ocov/ocovMax*100:0;

  /* ── 잘한 점 ── */
  if(b.avgGr > all.avgGr)
    good.push({t:'사무소 평균을 넘는 성장', d:'기준점 대비 '+pcs(b.avgGr)+' — 사무소 평균 '+pcs(all.avgGr)+'보다 '+(b.avgGr-all.avgGr).toFixed(1)+'%p 높습니다.'});
  if(up.length)
    good.push({t:'성장을 만든 거래처 '+up.length+'곳', d:up.slice(0,3).map(function(x){return esc(nm(x))+' '+sgn(x.d)}).join(' · ')+
      ' — 합계 월 '+sgn(up.reduce(function(t,x){return t+x.d},0))+' 백만 (월평균 기준)'});
  if(newCells.length)
    good.push({t:'신규 개시 '+newCells.length+'건', d:'전년 실적이 없던 거래처×품목에서 월평균 '+nf(newSum,1)+' 백만을 새로 만들었습니다.'+
      (newCells.length? ' 최다: '+esc(DATA.products[newCells.slice().sort(function(x,y){return y.v-x.v})[0].p]):'')});
  if(bg.delta>0)
    good.push({t:'가군 성장', d:'가군 성장금액 월 '+sgn(bg.delta)+' 백만 · 기준점 대비 '+pcs(bg.avgGr)+'. 수익성 높은 품목이 늘고 있습니다.'});
  if(trend>3)
    good.push({t:'최근 상승 추세', d:'최근 '+nh+'개월 평균이 직전 '+nh+'개월보다 '+pcs(trend)+' 높습니다.'});

  /* ── 부족한 점 ── */
  if(dn.length)
    bad.push({t:'감소한 거래처 '+dn.length+'곳', d:dn.slice(0,3).map(function(x){return esc(nm(x))+' '+sgn(x.d)}).join(' · ')+
      ' — 합계 월 '+sgn(dn.reduce(function(t,x){return t+x.d},0))+' 백만 (월평균 기준)'});
  if(stopCells.length)
    bad.push({t:'중단·이탈 '+stopCells.length+'건', d:'기준점 기준 월 '+nf(stopLoss,1)+' 백만이 빠졌습니다. 최대: '+
      stopCells.slice().sort(function(x,y){return y.loss-x.loss}).slice(0,2).map(function(x){
        return esc(nm(x))+' '+esc(DATA.products[x.p])}).join(' · ')});
  if(covR < ocovR)
    bad.push({t:'품목 커버리지 부족', d:'취급률 '+covR.toFixed(1)+'% — 사무소 평균 '+ocovR.toFixed(1)+'%보다 낮습니다. 거래처당 취급 품목 '+(cov/mine.length).toFixed(1)+'개.'});
  if(bg.delta<0)
    bad.push({t:'가군 역성장', d:'가군 성장금액 월 '+sgn(bg.delta)+' 백만 ('+pcs(bg.avgGr)+'). 수익군 비중이 줄고 있습니다.'});
  if(trend<-3)
    bad.push({t:'최근 하락 추세', d:'최근 '+nh+'개월 평균이 직전 '+nh+'개월보다 '+pcs(trend)+' 낮습니다.'});

  /* ── 변화시켜야 할 점 ── */
  var ng=nextGrade(b.avgGr);
  if(ng){
    var needAvg = b.pAvg*(1+ng.need) - b.cAvg;
    next.push({t:ng.g+' 등급까지 월 '+nf(Math.max(0,needAvg),1)+' 백만',
      d:'현재 '+pcs(b.avgGr)+' → '+ng.g+' 기준 '+(ng.need*100).toFixed(0)+'%. 월평균을 '+nf(b.cAvg,1)+'에서 '+nf(b.pAvg*(1+ng.need),1)+'으로 올려야 합니다.'});
  }
  var h2t=h2Target(mine), gaB=band(mine,GA);
  if(h2t>0)
    next.push({t:'하반기 가군 목표 월 '+nf(h2t/6,1)+' 백만',
      d:'가군 상반기 월평균 '+nf(gaB.cAvg,1)+' 대비 '+pcs(gaB.cAvg? (h2t/6/gaB.cAvg-1)*100 : 0)+' 수준입니다. 가군 MBO 품목 기준.'});
  if(stopCells.length){
    var top=stopCells.slice().sort(function(x,y){return y.loss-x.loss}).slice(0,2);
    next.push({t:'회복 우선 '+top.length+'건',
      d:top.map(function(x){return esc(nm(x))+' · '+esc(DATA.products[x.p])+' ('+nf(x.loss,1)+')'}).join(' / ')+
        ' — 되살리면 월 '+nf(top.reduce(function(t,x){return t+x.loss},0),1)+' 백만 회복'});
  }
  var gaps=mine.map(function(ac){ var miss=0; for(var p=0;p<NP;p++) if(!carried(ac,p)) miss++;
      return {ac:ac,miss:miss,c:band([ac],range(NP)).cAvg}; })
    .filter(function(x){return x.miss>0}).sort(function(x,y){return y.c-x.c}).slice(0,2);
  if(gaps.length)
    next.push({t:'코딩 확대 후보',
      d:gaps.map(function(x){return esc(nm(x))+' (미코딩 '+x.miss+'종)'}).join(' · ')+' — 실적 상위 거래처부터 품목 늘리기'});

  return {good:good.slice(0,4), bad:bad.slice(0,4), next:next.slice(0,4), b:b};
}
function insightCard(title, cls, items, empty){
  return '<div class="card ins '+cls+'"><div class="sechead"><h2>'+title+'</h2></div>'+
    (items.length? '<ol class="inslist">'+items.map(function(x){
      return '<li><div><b>'+x.t+'</b><p>'+x.d+'</p></div></li>'; }).join('')+'</ol>'
     : '<div class="sub2">'+empty+'</div>')+'</div>';
}

      if(S.ftype && a[2]!==S.ftype) return false;

    }).map(function(a){

      return {a:a,name:a[1],type:a[2],rep:DATA.reps[a[3]],cur:c,pv:p,tgt:t,rate:t?c/t*100:0,
              gr:REAL? bb.avgGr : growth(c,p), ga:g, gad:REAL? bb.delta : (g-gp), cov:covCount(a),
              pAvg:REAL?bb.pAvg:0, cAvg:REAL?bb.cAvg:0, grade:REAL?bb.avgGr:0,
              h2:REAL? (function(){var t2=0;for(var m2=6;m2<12;m2++)t2+=a[8][m2];return t2/6})() : 0,
              mth:REAL? (function(){var t3=0;for(var p3=0;p3<NP;p3++)t3+=a[6][p3][M-1];return t3})() : 0,
              mthC:lm>0?mth[lm]:0, mthP:lm>0?mth[lm-1]:0,
              mom:lm>0?growth(mth[lm],mth[lm-1]):0, risk:risks(a),trend:mth};
    });
  var k=S.sort.k,d=S.sort.d;
  rows.sort(function(x,y){ var vx=x[k],vy=y[k];
    if(k==='risk'){ vx=x.risk.length; vy=y.risk.length; }
    if(typeof vx==='string') return d*vx.localeCompare(vy,'ko'); return d*(vx-vy); });

  var cols = REAL
    ? [['name','거래처','l'],['rep','담당','l'],['pAvg','기준점(월)',''],['cAvg','26년 월평균',''],
       ['mth',DATA.months[M-1]+' 실적',''],['gr','성장률',''],['grade','등급',''],['gad','성장금액(월)',''],
       ['h2','하반기목표(월)',''],['cov','취급',''],['risk','신호','']]
    : [['name','거래처','l'],['type','유형','l'],['rep','담당','l'],['cur','실적',''],
       ['rate','달성률',''],['gr','전년비',''],['mom','전월비',''],['ga','가군',''],
       ['gad','가군 성장액',''],['cov','커버',''],['risk','신호','']];

  h+='<div class="tablewrap"><table><thead><tr>'+cols.map(function(c){
      return '<th class="'+c[2]+'" data-k="'+c[0]+'">'+c[1]+(k===c[0]?'<span class="ar">'+(d<0?'▼':'▲')+'</span>':'')+'</th>';
    }).join('')+'<th>추이</th></tr></thead><tbody>'+
    rows.map(function(r){
      if(REAL) return '<tr><td class="l">'+esc(r.name)+'<div class="sub2">코드 '+esc(r.a[5])+'</div></td>'+

        '<td>'+sparkline(r.trend, r.gr>=0?'var(--good)':'var(--crit)')+'</td></tr>';
      return '<tr><td class="l">'+esc(r.name)+'<div class="sub2">'+esc(r.a[5])+(r.a[4]?' · 직거래':'')+(r.a[9]>=0?' · <b>신규</b>':'')+'</div></td>'+

        '<td>'+sparkline(r.trend, r.gr>=0?'var(--good)':'var(--crit)')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  return h;
}

function viewProd(){

    var pr=range(NP).map(function(p){

  var list=scoped(), ms=range(M), a=agg(list,ms);

    var cells=[];
    list.forEach(function(ac){ for(var p=0;p<NP;p++){
      var st=statusOf(ac,p); if(st<0) continue;
      var b=band([ac],[p]);
      cells.push({ac:ac,p:p,st:st,b:b});
    }});
    var byStatus={}; STN.forEach(function(n,i){ byStatus[i]=cells.filter(function(c){return c.st===i}); });
    var newC=(byStatus[1]||[]).concat(byStatus[4]||[]);

/* ═══ 화면 · 종합평가 (회사 평가양식) ════════════ */
function critScale(v, c){
  if(!c || v==null || c.S==null) return '<span class="sub2">—</span>';
  var asc = c.S >= c.C;                       /* 값이 클수록 좋은 항목 */
  var lo = asc? Math.min(c.C, v) : Math.min(c.S, v);
  var hi = asc? Math.max(c.S, v) : Math.max(c.C, v);
  var pad = ((hi-lo)||Math.abs(hi)||1) * 0.18;
  lo -= pad; hi += pad;
  var span = (hi-lo)||1;
  var pos = function(x){ return Math.max(0,Math.min(100,(x-lo)/span*100)); };
  var s='<div class="crit"><div class="ct">';
  ['S','A','B','C'].forEach(function(g){ if(c[g]==null) return;
    s+='<span class="cm" style="left:'+pos(c[g])+'%" title="'+g+' '+c[g]+'"><i></i><b>'+g+'</b></span>';
  });
  s+='<span class="cv" style="left:'+pos(v)+'%"></span></div></div>';
  return s;
}
function critText(c){
  if(!c) return '';
  return ['S','A','B','C'].filter(function(g){return c[g]!=null})
    .map(function(g){return g+' '+c[g]+(c.unit||'')}).join(' · ');
}

      bindChart($('c0'),function(i){ return '<div class="t">'+DATA.months12[i]+'</div>'+
        tipRow(cvar('--s3'),Y2[0]+'년',nf(ys2.y24[i],1))+
        tipRow(cvar('--s4'),Y2[1]+'년',nf(ys2.y25[i],1))+
        (i<M? tipRow(cvar('--s1'),Y2[2]+'년',nf(ys2.y26[i],1)) : '')+
        (i<M? tipRow('','전년 동월비',pcs(growth(ys2.y26[i],ys2.y25[i]))) : ''); });
    }
    bindChart($('c1'),function(i){
      var act=i<M? moR.cur[i] : null;
      var tg=0; if(i>=M) list.forEach(function(x){tg+=x[8][i]});
      return '<div class="t">'+DATA.months12[i]+'</div>'+
        (act!=null? tipRow(cvar('--s1'),'실적',nf(act,1)) : tipRow(cvar('--s4'),'목표',nf(tg,1)))+
        tipRow('var(--ink-2)','기준점',nf(bmR,1))+
        tipRow('','기준점 대비',(act!=null? pcs((act/bmR-1)*100) : pcs((tg/bmR-1)*100)));
    });
  }
  else if(S.tab==='sum'){
    var mo=monthly(list);
    bindChart($('c1'),function(i){ return '<div class="t">'+DATA.months[i]+'</div>'+
      tipRow(cvar('--s1'),'2026 실적',nf(mo.cur[i]))+tipRow(cvar('--s3'),'2025 실적',nf(mo.prev[i]))+
      tipRow('var(--ink-2)','목표',nf(mo.tgt[i]))+
      tipRow('','달성률',(mo.tgt[i]?mo.cur[i]/mo.tgt[i]*100:0).toFixed(1)+'%')+
      tipRow('','전월비',(i>0?(growth(mo.cur[i],mo.cur[i-1])>=0?'+':'')+growth(mo.cur[i],mo.cur[i-1]).toFixed(1)+'%':'—')); });
  }
  if(S.tab==='rep'){
    Array.prototype.forEach.call(v.querySelectorAll('.repcard'),function(c){
      var go=function(){ S.rep = (S.rep===+c.dataset.r? null : +c.dataset.r); render(); };
      c.onclick=go; c.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} };
    });
    if(S.rep!==null){
      var mine=AC.filter(function(x){return x[3]===S.rep}), rm=monthly(mine);
      bindChart($('c2'),function(i){ return '<div class="t">'+DATA.months[i]+' · '+DATA.reps[S.rep]+'</div>'+
        tipRow(cvar('--s1'),'2026 실적',nf(rm.cur[i]))+tipRow(cvar('--s3'),'2025 실적',nf(rm.prev[i]))+
        tipRow('var(--ink-2)','목표',nf(rm.tgt[i])); });
    }
  }
  if(S.tab==='acct'){
    var q=$('q'); if(q){ q.oninput=function(){ S.q=q.value; var pos=q.selectionStart; render();
      var q2=$('q'); if(q2){q2.focus(); try{q2.setSelectionRange(pos,pos)}catch(e){}} }; }
    var ft=$('ftype'); if(ft) ft.onchange=function(){ S.ftype=ft.value; render(); };
    var fd=$('fdeal'); if(fd) fd.onchange=function(){ S.fdeal=fd.value; render(); };
    var fr=$('frep');  if(fr) fr.onchange=function(){ S.frep=fr.value; render(); };
    var rk=$('frisk'); if(rk) rk.onclick=function(){ S.frisk=!S.frisk; render(); };
    Array.prototype.forEach.call(v.querySelectorAll('thead th[data-k]'),function(th){
      th.onclick=function(){ var k=th.dataset.k;
        if(S.sort.k===k) S.sort.d*=-1; else S.sort={k:k,d:(k==='name'||k==='type'||k==='rep')?1:-1};
        render(); };
    });
  }
  if(S.tab==='prod'){
    var pm=[]; for(var p=0;p<NP;p++){ var arr=[]; for(var m=0;m<M;m++){ var s=0;
      list.forEach(function(ac){s+=ac[6][p][m]}); arr.push(s);} pm.push(arr); }
    bindChart($('c3'),function(i){ var rows='<div class="t">'+DATA.months[i]+'</div>';
      DATA.products.map(function(nm,pi){return {n:nm,v:pm[pi][i],c:cvar(SC[pi])}})
        .sort(function(a,b){return b.v-a.v}).forEach(function(r){ rows+=tipRow(r.c,r.n,nf(r.v)); });
      return rows; });
  }
  if(S.tab==='ga'){
    var mg=monthly(list);
    bindChart($('c5'),function(i){ return '<div class="t">'+DATA.months[i]+' · 가군</div>'+
      tipRow(cvar('--accent'),'가군',nf(mg.ga[i]))+
      tipRow('var(--ink-2)','전년 가군',nf(mg.gnaPrev[i]))+
      tipRow('','성장금액',sgn(mg.gna[i]-mg.gnaPrev[i]))+
      tipRow('','전체 대비',(mg.cur[i]?mg.gna[i]/mg.cur[i]*100:0).toFixed(1)+'%'); });
  }
  if(S.tab==='new'){
    var cnt=[]; for(var m=0;m<M;m++) cnt.push(0);
    list.forEach(function(ac){ for(var p=0;p<NP;p++){ var st=startOf(ac,p); if(st>=1) cnt[st]++; } });
    bindChart($('c6'),function(i){ return '<div class="t">'+DATA.months[i]+'</div>'+
      tipRow(cvar('--s1'),'처방 개시',cnt[i]+'건'); });
  }
}

/* ── 테마 ─────────────────────────────────────── */
function applyTheme(t){
  if(t) document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
  try{ t? localStorage.setItem('_hb3t',t) : localStorage.removeItem('_hb3t'); }catch(e){}
}
try{ var st=localStorage.getItem('_hb3t'); if(st) applyTheme(st); }catch(e){}

/* ── 접속 ─────────────────────────────────────── */
function boot(u){
  S.user=u;
  $('gate').style.display='none';
  $('app').hidden=false;
  $('officeLbl').textContent = DATA.office+' · '+DATA.year+'년';
  if(REAL){
    $('srcflag').className='pill neutral'; $('srcflag').textContent='실데이터';
    $('srcnote').innerHTML = DATA.division+' · '+DATA.office+' · 단위 백만원 · '+
      '출처: '+esc(DATA.source||'')+' ('+esc(DATA.scope||'')+' · 품목 '+NP+'종 · 거래처 '+AC.length+'개소)<br>'+
      '사무소·담당자 지표는 월별 파일의 <b>기준점 / 최종실적 / 성장금액 / 성장률</b> 원값, '+
      '거래처·품목은 <b>최종실적(50%)</b> 기준입니다. 모든 금액은 월평균 · 하반기 목표는 '+esc(DATA.targetScope||'')+' 기준.';
  } else {
    $('srcflag').className='demoflag'; $('srcflag').textContent='샘플 데이터';
    $('srcnote').innerHTML = '수치는 화면 구성 확인용 가상 값입니다.<br>'+DATA.office+' · 단위 백만원';
  }
  $('whoChip').textContent = u.r==='office' ? '소장' : '담당';
  $('whoName').textContent = u.n;
  renderTabs(); render();
}
function tryLogin(){
  var id=$('pw').value.trim(), u=findUser(id);
  if(!u){ $('_m').innerHTML='<span class="err">등록되지 않은 사번입니다. 소장에게 문의해 주세요.</span>';
    $('pw').select(); return; }
  try{ localStorage.setItem('_hb3i',id); }catch(e){}
  boot(u);
}
$('go').onclick=tryLogin;
$('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') tryLogin(); });
$('themeBtn').onclick=function(){
  var cur=document.documentElement.getAttribute('data-theme');
  var dark=matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(cur? (cur==='dark'?'light':'dark') : (dark?'light':'dark'));
};
$('outBtn').onclick=function(){ try{ localStorage.removeItem('_hb3i'); }catch(e){} location.reload(); };
var saved=null; try{ saved=localStorage.getItem('_hb3i'); }catch(e){}
if(saved && findUser(saved)) boot(findUser(saved));
else setTimeout(function(){ try{$('pw').focus()}catch(e){} },200);
})();

</script>
</body>
</html>
