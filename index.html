function mbFall(t){                       /* 표에 없는 유형은 4지표로 조합 */
  var E=t.charAt(0)==='E', N=t.charAt(1)==='N', F=t.charAt(2)==='F', J=t.charAt(3)==='J';
  return {tag:(E?'외부 자극에서 에너지를 얻고 ':'혼자 정리하며 에너지를 회복하고 ')+
      (N?'가능성과 큰 그림을 먼저 봅니다.':'사실과 경험을 먼저 확인합니다.'),
    drive:(F?'의미와 인정이 먼저 움직입니다.':'성과와 논리가 먼저 움직입니다.'),
    talk:(F?'사실 확인 전에 인정부터, ':'결론부터 짧게, ')+(E?'대화로 풀어 주세요.':'1:1과 사전 예고가 좋습니다.'),
    assign:(J?'목표와 마감을 분명히 주세요.':'한 번에 하나, 날짜로 못 박아 주세요.'),
    watch:(J?'계획 변경에 스트레스를 받습니다.':'루틴 관리가 새기 쉽습니다.')};
}
function mbInfo(name){
  var t=MB[name]; if(!t) return null;
  var p=MBP[t] || mbFall(t);
  return {t:t, p:p};
}
/* 데이터에서 뽑은, 이 사람에게 지금 맞는 운영 한 줄 */
function mbQ4(name, r){
  var t=MB[name]; if(!t || !r) return [];
  var E=t.charAt(0)==='E', F=t.charAt(2)==='F', J=t.charAt(3)==='J';
  var out=[], gap=r.gap, x=r.x;
  out.push(J? '월 갭 <b>'+sgn(gap)+' 백만</b>을 그대로 개인 4Q 목표로 줘도 받아들입니다. 마감일과 보고 시점만 함께 정하세요.'
            : '월 갭 '+sgn(gap)+' 백만을 한 번에 주지 마세요. <b>10·11·12월로 쪼개</b> 한 달에 하나씩, 날짜로 확인하는 편이 실제로 더 채워집니다.');
  if(F) out.push('미션을 전달할 때 숫자보다 <b>이유</b>를 먼저 — "왜 이 거래처부터인지"가 납득되면 그다음은 알아서 움직입니다.');
  else  out.push('미션은 <b>결론부터</b> — 어디를 얼마나, 언제까지인지만 명확하면 방법은 본인이 찾습니다.');
  if(x.dn.length>=3)
    out.push((E? '감소 '+x.dn.length+'곳은 회의에서 공개 진행판으로 걸어 두면 속도가 붙습니다.'
              : '감소 '+x.dn.length+'곳은 공개 비교 대신 1:1에서 한 곳씩 원인을 짚어 주세요.'));
  if(x.stop.length>=3)
    out.push(J? '중단·이탈 복구는 <b>체크리스트 형태</b>로 넘기면 끝까지 갑니다.'
              : '중단·이탈 복구는 목록이 길면 멈춥니다. <b>상위 3건만</b> 잘라서 주세요.');
  if(x.b.avgGr<0)
    out.push(F? '역성장 구간입니다. 질책보다 <b>같이 원인을 찾는 자리</b>가 회복이 빠릅니다.'
              : '역성장 구간입니다. 사실 관계와 대책만 확인하고, 판단은 본인에게 맡기는 편이 빠릅니다.');
  return out.slice(0,4);
}
function mgmtCard(name, r, compact){
  var m=mbInfo(name); if(!m) return '';
  var q=mbQ4(name, r);
  var rows=[['성향', m.p.tag],['동기부여', m.p.drive],['피드백', m.p.talk],
            ['미션 부여', m.p.assign],['주의', m.p.watch]];
  return '<div class="card mgmt'+(compact?' cp':'')+'">'+
    '<div class="sechead"><h2>매니지먼트 포인트</h2>'+
      '<span class="mbti">'+esc(m.t)+'</span></div>'+
    '<div class="mg">'+rows.map(function(x){
      return '<div class="row"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>';
    }).join('')+'</div>'+
    (q.length? '<div class="mgq4"><div class="eyebrow">4Q 운영 포인트</div><ul>'+
      q.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>':'')+
    '<div class="sub2" style="margin-top:10px">· MBTI는 평가 기준이 아니라 대화 방식의 참고선입니다. 같은 유형이라도 사람마다 다르니 실제 반응으로 계속 보정해 주세요.</div>'+
  '</div>';
}

/* ═══ 화면 7 · 4분기 성장전략 및 미션 ═══════════
   기존 실적·가군·신규/중단·주의신호를 종합해 자동 산출한다.
   1) 사무소 성장전략 및 미션  2) 담당자별 성장전략 및 미션      */
var QCO = (DATA.gradeQ && DATA.gradeQ['4Q']) || 1.3;   /* 4Q 분기계수 */
function shortNm(s,n){ n=n||15; return esc(s.length>n? s.slice(0,n)+'…' : s); }

function q4Ctx(list, repIdx){
  var b   = mainBand(list, repIdx);            /* 공식 기준점·실적·성장률 */
  var rem = Math.max(1, 12 - M);               /* 남은 개월 (8~12월) */
  var cSum= b.cAvg * M;
  var need= function(g){ return (b.pAvg*(1+g)*12 - cSum)/rem; };   /* 남은 달 필요 월평균 */
  var need4=function(g){ return b.pAvg*(1+g*QCO); };               /* 4Q 단독 기준 월평균 */

  var accs=list.map(function(ac){ var bb=band([ac],range(NP));
    return {ac:ac, d:bb.delta, gr:bb.avgGr, c:bb.cAvg, p:bb.pAvg}; });
  var dn=accs.filter(function(x){return x.d<-0.3}).sort(function(x,y){return x.d-y.d});
  var up=accs.filter(function(x){return x.d> 0.3}).sort(function(x,y){return y.d-x.d});

  var stop=[], news=[];
  list.forEach(function(ac){ for(var p=0;p<NP;p++){ var st=statusOf(ac,p); if(st<0) continue;
    var bb=band([ac],[p]);
    if(st===2||st===3) stop.push({ac:ac,p:p,loss:bb.pAvg});
    if(st===1||st===4) news.push({ac:ac,p:p,v:bb.cAvg});
  }});
  stop.sort(function(x,y){return y.loss-x.loss});
  news.sort(function(x,y){return y.v-x.v});

  var bg=band(list,GA), bAll=band(list,range(NP));
  var gaMiss=accs.filter(function(x){ return x.c>0 && !GA.some(function(p){return carried(x.ac,p)}) })
                 .sort(function(x,y){return y.c-x.c});
  var gaLow =accs.filter(function(x){ var g=band([x.ac],GA);
      return g.cAvg>0 && x.c>0 && g.cAvg/x.c*100 < 8; })
      .sort(function(x,y){return y.c-x.c});

  var t4=0, h2=0, tq=[0,0,0];
  list.forEach(function(a){ for(var m=9;m<12;m++){ t4+=a[8][m]; tq[m-9]+=a[8][m]; }
                            for(var m2=6;m2<12;m2++) h2+=a[8][m2]; });

  var risky=list.filter(function(a){ return risks(a).length>=2; })
    .map(function(a){ return {ac:a, f:risks(a), c:band([a],range(NP)).cAvg}; })
    .sort(function(x,y){return y.c-x.c});

  var cov=0; list.forEach(function(x){ cov+=covCount(x); });
  var covR = list.length? cov/(list.length*NP)*100 : 0;

  var mo=monthly(list), nh=Math.min(3,Math.floor(M/2)), r1=0,r2=0;
  for(var k=0;k<nh;k++){ r2+=mo.cur[M-1-k]; r1+=mo.cur[M-1-nh-k]; }
  var trend = r1>0? (r2/r1-1)*100 : 0;

  return {b:b, rem:rem, cSum:cSum, need:need, need4:need4,
          accs:accs, dn:dn, up:up, stop:stop, news:news,
          bg:bg, bAll:bAll, gaMiss:gaMiss, gaLow:gaLow,
          t4:t4, h2:h2, tq:tq, risky:risky, covR:covR, trend:trend, list:list};
}

/* 미션 카드 렌더 */
function msnList(items){
  return '<ol class="msn">'+items.map(function(x,i){
    return '<li><div class="no">'+('0'+(i+1)).slice(-2)+'</div><div>'+
      '<h3>'+x.t+'</h3>'+
      (x.why? '<p class="why">'+x.why+'</p>':'')+
      (x.kv&&x.kv.length? '<div class="kpiline">'+x.kv.map(function(k){
        return '<span class="tagkv">'+esc(k[0])+' <b>'+k[1]+'</b></span>'; }).join('')+'</div>':'')+
      (x.todo&&x.todo.length? '<ul class="do">'+x.todo.map(function(t){
        return '<li>'+t+'</li>'; }).join('')+'</ul>':'')+
      '</div></li>';
  }).join('')+'</ol>';
}

/* ── 사무소 미션 ── */
function q4OfficeMissions(x, named){
  if(named==null) named=true;
  var kvN=function(a){ return named? a : []; };
  var ms=[], sum=function(a,f){ return a.reduce(function(t,v){return t+f(v)},0); };
  var tg = nextGrade(x.b.avgGr) || {g:'S', need:DATA.grade['S']};
  var nd = x.need(tg.need), gap = nd - x.b.cAvg;

  ms.push({t:'연간 '+tg.g+' 등급 라인 확보',
    why:'기준점 '+nf(x.b.pAvg,1)+' 백만 대비 현재 '+pcs(x.b.avgGr)+'입니다. '+tg.g+' 기준 '+(tg.need*100).toFixed(0)+
        '%를 채우려면 남은 '+x.rem+'개월(8~12월) 월평균을 '+nf(nd,1)+' 백만까지 올려야 합니다. '+
        '4Q 단독으로 보면 분기계수 '+QCO+' 적용 시 월 '+nf(x.need4(tg.need),1)+' 백만이 기준선입니다.',
    kv:[['필요 월평균', nf(nd,1)],['현재 월평균', nf(x.b.cAvg,1)],['월 갭', sgn(gap)],['4Q 기준선', nf(x.need4(tg.need),1)]],
    todo:['담당자별 필요 증분을 아래 배분표대로 나누고 월 마감마다 갭을 다시 계산',
          '8·9월 마감 시점에 갭이 절반 이상 남으면 4Q 단독 목표로 전환해 관리',
          '등급을 가르는 것은 성장률입니다. 신규 매출보다 <b>빠진 자리 회복</b>이 속도가 빠릅니다']});

  if(x.dn.length){
    var top=x.dn.slice(0,5), rec=Math.abs(sum(top,function(v){return v.d}));
    ms.push({t:'감소 상위 '+top.length+'개소 회복 — 월 '+nf(rec,1)+' 백만',
      why:'기준점 대비 줄어든 거래처가 '+x.dn.length+'곳, 합계 월 '+sgn(sum(x.dn,function(v){return v.d}))+
          ' 백만입니다. 그중 상위 '+top.length+'곳이 '+ (rec/Math.abs(sum(x.dn,function(v){return v.d}))*100).toFixed(0)+
          '%를 차지합니다 — 여기만 되돌려도 목표 갭의 '+(gap>0? Math.min(999,rec/gap*100).toFixed(0)+'%':'대부분')+'을 메웁니다.',
      kv:kvN(top.map(function(v){ return [shortNm(v.ac[1],10), sgn(v.d)]; })),
      todo:['거래처별로 <b>언제부터·어느 품목이</b> 빠졌는지 제품 탭에서 확인 후 방문 어젠다 확정',
            '경쟁품 전환·처방의 변경·재고 조정 중 무엇인지 구분 — 원인별로 대응이 다릅니다',
            '10월 안에 1차 복귀 여부를 판정하고, 회복이 어려우면 대체 거래처로 목표를 이관']});
  }

  if(x.stop.length){
    var st=x.stop.slice(0,5), loss=sum(x.stop,function(v){return v.loss});
    ms.push({t:'중단·이탈 '+x.stop.length+'건 복구 — 월 '+nf(loss,1)+' 백만',
      why:'전년에 쓰던 거래처×품목 중 최근 2개월 실적이 없는 건이 '+x.stop.length+'건이고, 기준점 기준 월 '+nf(loss,1)+
          ' 백만이 통째로 빠져 있습니다. 이미 코드가 열려 있던 자리라 신규 개척보다 회복 확률이 높습니다.',
      kv:kvN(st.map(function(v){ return [shortNm(v.ac[1],8)+'·'+shortNm(DATA.products[v.p],8), nf(v.loss,1)]; })),
      todo:['상위 5건을 담당자별 <b>4Q 복구 리스트</b>로 고정하고 주간 회의에서 진행 상황만 확인',
            '재고·약가·DC 사유면 즉시 처리, 처방 변경이면 KOL 면담 일정부터 잡기']});
  }

  var gaShare = x.bAll.cAvg? x.bg.cAvg/x.bAll.cAvg*100 : 0;
  var gaTgt4  = x.tq[0]+x.tq[1]+x.tq[2];
  ms.push({t:'가군 비중 '+gaShare.toFixed(1)+'% → 4Q 상향',
    why:'가군 월평균 '+nf(x.bg.cAvg,1)+' 백만(전체의 '+gaShare.toFixed(1)+'%), 기준점 대비 '+pcs(x.bg.avgGr)+'입니다. '+
        (gaTgt4>0? '4Q 가군 MBO 목표는 월평균 '+nf(gaTgt4/3,1)+' 백만으로 현재의 '+
          (x.bg.cAvg? (gaTgt4/3/x.bg.cAvg*100).toFixed(0):'—')+'% 수준입니다. ':'')+
        '실적은 나오는데 가군을 한 품목도 쓰지 않는 거래처가 '+x.gaMiss.length+'곳 남아 있습니다.',
    kv:[['가군 월평균', nf(x.bg.cAvg,1)],['가군 성장금액', sgn(x.bg.delta)],
        ['4Q 목표(월)', gaTgt4>0? nf(gaTgt4/3,1):'—'],['미취급(실적보유)', x.gaMiss.length+'곳']],
    todo:(named && x.gaMiss.length? ['미취급 실적 상위 '+Math.min(5,x.gaMiss.length)+'곳(<b>'+
            x.gaMiss.slice(0,5).map(function(v){return shortNm(v.ac[1],10)}).join(' · ')+
            '</b>)부터 코딩 협의 — 4Q 안에 최소 절반 개시'] : [])
          .concat(['같은 매출이면 가군이 이익률 평가에 유리합니다. 일반 품목 방어보다 가군 1건 추가가 점수로는 더 큽니다',
                   '담당자별 가군 성장금액이 마이너스인 사람은 품목 단위로 원인을 먼저 확인'])});

  if(x.risky.length)
    ms.push({t:'주의 거래처 '+x.risky.length+'개소 4Q 집중관리',
      why:'신호가 2개 이상 겹친 거래처입니다(3개월 연속 감소 · 기준점 -10% 이하 · 중단·이탈 다발). '+
          '합계 월평균 '+nf(x.risky.reduce(function(t,v){return t+v.c},0),1)+' 백만으로, 방치하면 4Q 성장률이 더 내려갑니다.',
      kv:kvN(x.risky.slice(0,5).map(function(v){ return [shortNm(v.ac[1],10), nf(v.c,1)]; })),
      todo:['소장 동행 방문 대상으로 지정 — 담당자 단독 대응으로는 되돌리기 어려운 구간입니다',
            '거래처 탭 「주의 거래처만」 토글로 목록을 뽑아 담당자와 1:1로 원인을 정리']});

  if(x.news.length)
    ms.push({t:'신규 개시 흐름 유지 — 현재 '+x.news.length+'건 / 월 '+nf(x.news.reduce(function(t,v){return t+v.v},0),1)+' 백만',
      why:'전년 실적이 없던 자리에서 새로 만든 매출입니다. 커버리지는 '+x.covR.toFixed(1)+
          '%로 빈칸이 곧 4Q 확대 여지입니다. 최근 추세는 직전 대비 '+pcs(x.trend)+'입니다.',
      kv:[['신규 건수', x.news.length+'건'],['신규 월평균', nf(x.news.reduce(function(t,v){return t+v.v},0),1)],
          ['커버리지', x.covR.toFixed(1)+'%'],['최근 추세', pcs(x.trend)]],
      todo:['신규를 많이 만든 담당자의 접근법을 10월 사무소 회의에서 공유',
            '미코딩이 많은 상위 거래처 = 실적은 있는데 품목이 적은 곳. 교차판매 1순위입니다']});

  return ms;
}

/* ── 담당자 미션 ── */
function q4RepMissions(i){
  var mine=AC.filter(function(a){return a[3]===i});
  var x=q4Ctx(mine, i), ms=[];
  var off=q4Ctx(AC.filter(function(a){return ACTIVE.indexOf(a[3])>=0}), null);
  var tg=nextGrade(x.b.avgGr) || {g:'S', need:DATA.grade['S']};
  var nd=x.need(tg.need), gap=nd-x.b.cAvg;

  ms.push({t:tg.g+' 등급까지 월 '+nf(Math.max(0,gap),1)+' 백만',
    why:'기준점 '+nf(x.b.pAvg,1)+' → 현재 월평균 '+nf(x.b.cAvg,1)+' ('+pcs(x.b.avgGr)+
        ', 사무소 평균 '+pcs(off.b.avgGr)+'). 남은 '+x.rem+'개월 월평균 '+nf(nd,1)+' 백만이 '+tg.g+' 라인입니다.',
    kv:[['현재 등급', gradeOf(x.b.avgGr)],['목표', tg.g],['필요 월평균', nf(nd,1)],['월 갭', sgn(gap)]]});

  if(x.dn.length)
    ms.push({t:'회복 우선 '+Math.min(3,x.dn.length)+'개소',
      why:'줄어든 거래처 '+x.dn.length+'곳 합계 월 '+sgn(x.dn.reduce(function(t,v){return t+v.d},0))+
          ' 백만. 상위 '+Math.min(3,x.dn.length)+'곳만 기준점 수준으로 되돌려도 월 '+
          nf(Math.abs(x.dn.slice(0,3).reduce(function(t,v){return t+v.d},0)),1)+' 백만이 돌아옵니다.',
      kv:x.dn.slice(0,3).map(function(v){ return [shortNm(v.ac[1],10), sgn(v.d)]; })});

  if(x.stop.length)
    ms.push({t:'중단·이탈 복구 '+Math.min(3,x.stop.length)+'건',
      why:'이미 코드가 열려 있던 자리에서 월 '+nf(x.stop.reduce(function(t,v){return t+v.loss},0),1)+
          ' 백만이 빠졌습니다. 신규보다 회복이 빠릅니다.',
      kv:x.stop.slice(0,3).map(function(v){ return [shortNm(v.ac[1],8)+'·'+shortNm(DATA.products[v.p],8), nf(v.loss,1)]; })});

  var sh = x.bAll.cAvg? x.bg.cAvg/x.bAll.cAvg*100 : 0;
  var osh= off.bAll.cAvg? off.bg.cAvg/off.bAll.cAvg*100 : 0;
  var gaT= (x.tq[0]+x.tq[1]+x.tq[2])/3;
  ms.push({t:'가군 '+(sh<osh? '비중 확대 (사무소 평균 미달)':'성장 유지'),
    why:'가군 월평균 '+nf(x.bg.cAvg,1)+' 백만, 비중 '+sh.toFixed(1)+'% (사무소 '+osh.toFixed(1)+'%), 성장금액 월 '+sgn(x.bg.delta)+'. '+
        (x.gaMiss.length? '가군 미취급(실적보유) '+x.gaMiss.length+'곳 — 상위: '+
          x.gaMiss.slice(0,3).map(function(v){return shortNm(v.ac[1],10)+' ('+nf(v.c,1)+')'}).join(' · ') : '담당 거래처 모두 가군을 취급 중입니다.'),
    kv:[['가군 월평균', nf(x.bg.cAvg,1)],['비중', sh.toFixed(1)+'%'],['성장금액', sgn(x.bg.delta)],
        ['4Q 목표(월)', gaT>0? nf(gaT,1):'—']]});

  var gaps=mine.map(function(ac){ var miss=0; for(var p=0;p<NP;p++) if(!carried(ac,p)) miss++;
      return {ac:ac, miss:miss, c:band([ac],range(NP)).cAvg}; })
    .filter(function(v){return v.miss>0 && v.c>0}).sort(function(a,b2){return b2.c-a.c}).slice(0,3);
  if(gaps.length)
    ms.push({t:'교차판매 코딩 확대',
      why:'실적은 나오는데 품목 수가 적은 거래처입니다. 커버리지 '+x.covR.toFixed(1)+
          '% (사무소 '+off.covR.toFixed(1)+'%). 방문 중인 곳이라 추가 코딩 비용이 가장 낮습니다.',
      kv:gaps.map(function(v){ return [shortNm(v.ac[1],10), '미코딩 '+v.miss+'종']; })});

  return {ms:ms, x:x, off:off, tg:tg, nd:nd, gap:gap};
}

       '<b>자동 산출</b>한 4분기 전략입니다. 모든 금액은 <b>월평균 백만원</b>이며, 등급은 기준점(25년 월평균) 대비 성장률표를 따릅니다. '+

    '<div class="card kpi"><div class="label">회복 가능 물량</div>'+

       '<th>4Q 단독 기준(×'+QCO+')</th><th class="l">판정</th></tr></thead><tbody>'+
    scen.map(function(g){
      var need=DATA.grade[g], nd=X.need(need), lift=X.b.cAvg? (nd/X.b.cAvg-1)*100 : 0;

       (isOffice? '':' · 개별 거래처는 본인 담당만 아래에 표시')+'</span></div>'+

  var idxs = isOffice? ACTIVE.slice() : [S.user.r];

    var r=q4RepMissions(i); return {i:i, r:r};
  }).sort(function(a,b2){ return b2.r.x.b.avgGr-a.r.x.b.avgGr; });

  if(isOffice){
    var totGap = rows.reduce(function(t,v){ return t+Math.max(0,v.r.gap); },0);
    var oGap   = Math.max(0, X.need(tg.need)-X.b.cAvg);
    var baseSum= rows.reduce(function(t,v){ return t+v.r.x.b.pAvg; },0) || 1;

      '<th>사무소 '+tg.g+' 배분</th><th>배분 후 필요</th><th>가군 비중</th></tr></thead><tbody>'+
      rows.map(function(v){
        var b=v.r.x.b, sh=v.r.x.bAll.cAvg? v.r.x.bg.cAvg/v.r.x.bAll.cAvg*100:0;
        var al=oGap*(b.pAvg/baseSum);
        return '<tr><td class="l grp">'+esc(DATA.reps[v.i])+'</td>'+
          '<td class="num sub2">'+nf(b.pAvg,1)+'</td><td class="num">'+nf(b.cAvg,1)+'</td>'+
          '<td class="num">'+deltaTag(b.avgGr)+'</td><td>'+gradeBadge(gradeOf(b.avgGr))+'</td>'+
          '<td>'+gradeBadge(v.r.tg.g)+'</td>'+
          '<td class="num">'+nf(v.r.nd,1)+'</td>'+
          '<td class="num '+(v.r.gap<=0?'pos':'neg')+'">'+sgn(v.r.gap)+'</td>'+
          '<td class="num neg">'+sgn(al)+'</td>'+
          '<td class="num"><b>'+nf(b.cAvg+al,1)+'</b></td>'+
          '<td class="num sub2">'+sh.toFixed(1)+'%</td></tr>';
      }).join('')+
      '<tr class="sep"><td class="l grp">합계 · 사무소</td>'+
      '<td class="num sub2">'+nf(X.b.pAvg,1)+'</td><td class="num">'+nf(X.b.cAvg,1)+'</td>'+
      '<td class="num">'+deltaTag(X.b.avgGr)+'</td><td>'+gradeBadge(gradeOf(X.b.avgGr))+'</td>'+
      '<td>'+gradeBadge(tg.g)+'</td><td class="num">'+nf(rows.reduce(function(t,v){return t+v.r.nd},0),1)+'</td>'+
      '<td class="num '+(totGap<=0?'pos':'neg')+'">'+sgn(totGap)+'</td>'+
      '<td class="num neg">'+sgn(oGap)+'</td>'+
      '<td class="num"><b>'+nf(X.need(tg.need),1)+'</b></td>'+
      '<td class="num sub2">'+(X.bAll.cAvg? (X.bg.cAvg/X.bAll.cAvg*100).toFixed(1):'0.0')+'%</td></tr>'+
      '</tbody></table></div>'+
      '<div class="sub2" style="margin-top:9px">· <b>개인 필요</b>는 각자 바로 위 등급까지의 라인, '+
      '<b>사무소 '+tg.g+' 배분</b>은 사무소 갭 '+nf(oGap,1)+' 백만을 기준점 비중대로 나눈 값입니다. '+
      '개인 갭 합계 '+nf(totGap,1)+' 백만 vs 사무소 갭 '+nf(oGap,1)+' 백만 — 개인 목표를 다 채우면 사무소 목표는 '+
      (totGap>=oGap? '넘어섭니다':'아직 '+nf(oGap-totGap,1)+' 백만 모자랍니다')+'.</div></div>';
  }

  /* ── 2. 담당자별 성장전략 및 미션 ── */
  h += '<div class="sechead" style="margin:18px 0 10px"><h2>2. 담당자별 성장전략 및 미션</h2>'+
       '<span class="note">'+(isOffice? ACTIVE.length+'명 · 성장률 순':'본인 담당')+'</span></div>';
  h += '<div class="q4grid">'+rows.map(function(v){
    var b=v.r.x.b;
    return '<div class="card mcard o">'+
      '<div class="qhead"><span class="nm">'+esc(DATA.reps[v.i])+'</span>'+
        gradeBadge(gradeOf(b.avgGr))+
        '<span class="sub2">기준점 '+nf(b.pAvg,1)+' → '+nf(b.cAvg,1)+' · '+pcs(b.avgGr)+'</span></div>'+

        '<span class="tagkv">목표 '+v.r.tg.g+' <b>'+nf(v.r.nd,1)+'</b></span>'+
        '<span class="tagkv">월 갭 <b>'+sgn(v.r.gap)+'</b></span>'+

      msnList(v.r.ms)+
      mgmtCard(DATA.reps[v.i], v.r, true)+'</div>';

  return h;

function render(){
  var v=$('view');
  if(S.tab==='sum') v.innerHTML=viewSum();
  else if(S.tab==='rep') v.innerHTML=viewRep();
  else if(S.tab==='acct') v.innerHTML=viewAcct();
  else if(S.tab==='prod') v.innerHTML=viewProd();
  else if(S.tab==='ga') v.innerHTML=viewGa();
  else if(S.tab==='new') v.innerHTML=viewNew();
  else if(S.tab==='eval') v.innerHTML=viewEval();
  else if(S.tab==='q4') v.innerHTML=viewQ4();
  else v.innerHTML=viewGuide();
  bindPeriod(); hideTip();

  var list=scoped();
  if(S.tab==='sum' && REAL){
    var moR=monthly(list), bmR=baseMonth(list);
    if(DATA.hasPrev2){
      var ys2=yearSeries(list), Y2=DATA.years||[2024,2025,2026];
      bindChart($('c0'),function(i){ return '<div class="t">'+DATA.months12[i]+'</div>'+
        tipRow(cvar('--s3'),Y2[0]+'년',nf(ys2.y24[i],1))+
        tipRow(cvar('--s4'),Y2[1]+'년',nf(ys2.y25[i],1))+
        (i<M? tipRow(cvar('--s1'),Y2[2]+'년',nf(ys2.y26[i],1)) : '')+
        (i<M? tipRow('','전년 동월비',pcs(growth(ys2.y26[i],ys2.y25[i]))) : ''); });
    }
    bindChart($('c1'),function(i){
      var act=i<M? moR.cur[i] : null;
      var tg=0; if(i>=M) list.forEach(function(x){tg+=x[8][i]});
      return '<div class="t">'+DATA.months12[i]+'</div>'+
        (act!=null? tipRow(cvar('--s1'),'실적',nf(act,1)) : tipRow(cvar('--s4'),'목표',nf(tg,1)))+
        tipRow('var(--ink-2)','기준점',nf(bmR,1))+
        tipRow('','기준점 대비',(act!=null? pcs((act/bmR-1)*100) : pcs((tg/bmR-1)*100)));
    });
  }
  else if(S.tab==='sum'){
    var mo=monthly(list);
    bindChart($('c1'),function(i){ return '<div class="t">'+DATA.months[i]+'</div>'+
      tipRow(cvar('--s1'),'2026 실적',nf(mo.cur[i]))+tipRow(cvar('--s3'),'2025 실적',nf(mo.prev[i]))+
      tipRow('var(--ink-2)','목표',nf(mo.tgt[i]))+
      tipRow('','달성률',(mo.tgt[i]?mo.cur[i]/mo.tgt[i]*100:0).toFixed(1)+'%')+
      tipRow('','전월비',(i>0?(growth(mo.cur[i],mo.cur[i-1])>=0?'+':'')+growth(mo.cur[i],mo.cur[i-1]).toFixed(1)+'%':'—')); });
  }
  if(S.tab==='rep'){
    Array.prototype.forEach.call(v.querySelectorAll('.repcard'),function(c){
      var go=function(){ S.rep = (S.rep===+c.dataset.r? null : +c.dataset.r); render(); };
      c.onclick=go; c.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} };
    });
    if(S.rep!==null){
      var mine=AC.filter(function(x){return x[3]===S.rep}), rm=monthly(mine);
      bindChart($('c2'),function(i){ return '<div class="t">'+DATA.months[i]+' · '+DATA.reps[S.rep]+'</div>'+
        tipRow(cvar('--s1'),'2026 실적',nf(rm.cur[i]))+tipRow(cvar('--s3'),'2025 실적',nf(rm.prev[i]))+
        tipRow('var(--ink-2)','목표',nf(rm.tgt[i])); });
    }
  }
  if(S.tab==='acct'){
    var q=$('q'); if(q){ q.oninput=function(){ S.q=q.value; var pos=q.selectionStart; render();
      var q2=$('q'); if(q2){q2.focus(); try{q2.setSelectionRange(pos,pos)}catch(e){}} }; }
    var ft=$('ftype'); if(ft) ft.onchange=function(){ S.ftype=ft.value; render(); };
    var fd=$('fdeal'); if(fd) fd.onchange=function(){ S.fdeal=fd.value; render(); };
    var fr=$('frep');  if(fr) fr.onchange=function(){ S.frep=fr.value; render(); };
    var rk=$('frisk'); if(rk) rk.onclick=function(){ S.frisk=!S.frisk; render(); };
    Array.prototype.forEach.call(v.querySelectorAll('thead th[data-k]'),function(th){
      th.onclick=function(){ var k=th.dataset.k;
        if(S.sort.k===k) S.sort.d*=-1; else S.sort={k:k,d:(k==='name'||k==='type'||k==='rep')?1:-1};
        render(); };
    });
  }
  if(S.tab==='prod'){
    var pm=[]; for(var p=0;p<NP;p++){ var arr=[]; for(var m=0;m<M;m++){ var s=0;
      list.forEach(function(ac){s+=ac[6][p][m]}); arr.push(s);} pm.push(arr); }
    bindChart($('c3'),function(i){ var rows='<div class="t">'+DATA.months[i]+'</div>';
      DATA.products.map(function(nm,pi){return {n:nm,v:pm[pi][i],c:cvar(SC[pi])}})
        .sort(function(a,b){return b.v-a.v}).forEach(function(r){ rows+=tipRow(r.c,r.n,nf(r.v)); });
      return rows; });
  }
  if(S.tab==='ga'){
    var mg=monthly(list);
    bindChart($('c5'),function(i){ return '<div class="t">'+DATA.months[i]+' · 가군</div>'+
      tipRow(cvar('--accent'),'가군',nf(mg.ga[i]))+
      tipRow('var(--ink-2)','전년 가군',nf(mg.gnaPrev[i]))+
      tipRow('','성장금액',sgn(mg.gna[i]-mg.gnaPrev[i]))+
      tipRow('','전체 대비',(mg.cur[i]?mg.gna[i]/mg.cur[i]*100:0).toFixed(1)+'%'); });
  }
  if(S.tab==='new'){
    var cnt=[]; for(var m=0;m<M;m++) cnt.push(0);
    list.forEach(function(ac){ for(var p=0;p<NP;p++){ var st=startOf(ac,p); if(st>=1) cnt[st]++; } });
    bindChart($('c6'),function(i){ return '<div class="t">'+DATA.months[i]+'</div>'+
      tipRow(cvar('--s1'),'처방 개시',cnt[i]+'건'); });
  }
}

function applyTheme(t){
  if(t) document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
  try{ t? localStorage.setItem('_hb3t',t) : localStorage.removeItem('_hb3t'); }catch(e){}
}

    $('srcflag').className='pill neutral'; $('srcflag').textContent='실데이터';
    $('srcnote').innerHTML = DATA.division+' · '+DATA.office+' · 단위 백만원 · '+
      '출처: '+esc(DATA.source||'')+' ('+esc(DATA.scope||'')+' · 품목 '+NP+'종 · 거래처 '+AC.length+'개소)<br>'+
      '사무소·담당자 지표는 월별 파일의 <b>기준점 / 최종실적 / 성장금액 / 성장률</b> 원값, '+
      '거래처·품목은 <b>최종실적(50%)</b> 기준입니다. 모든 금액은 월평균 · 하반기 목표는 '+esc(DATA.targetScope||'')+' 기준.';
  } else {
    $('srcflag').className='demoflag'; $('srcflag').textContent='샘플 데이터';
    $('srcnote').innerHTML = '수치는 화면 구성 확인용 가상 값입니다.<br>'+DATA.office+' · 단위 백만원';
  }
  $('whoChip').textContent = u.r==='office' ? '소장' : '담당';
  $('whoName').textContent = u.n;
  renderTabs(); render();
}
function tryLogin(){
  var id=$('pw').value.trim(), u=findUser(id);
  if(!u){ $('_m').innerHTML='<span class="err">등록되지 않은 사번입니다. 소장에게 문의해 주세요.</span>';
    $('pw').select(); return; }
  try{ localStorage.setItem('_hb3i',id); }catch(e){}
  boot(u);
}
$('go').onclick=tryLogin;
$('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') tryLogin(); });
$('themeBtn').onclick=function(){
  var cur=document.documentElement.getAttribute('data-theme');
  var dark=matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(cur? (cur==='dark'?'light':'dark') : (dark?'light':'dark'));
};
$('outBtn').onclick=function(){ try{ localStorage.removeItem('_hb3i'); }catch(e){} location.reload(); };
var saved=null; try{ saved=localStorage.getItem('_hb3i'); }catch(e){}
if(saved && findUser(saved)) boot(findUser(saved));
else setTimeout(function(){ try{$('pw').focus()}catch(e){} },200);
})();

</script>
</body>
</html>
