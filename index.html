<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="지방1사업부 성과관리 플랫폼 (내부용)">
<meta name="robots" content="noindex,nofollow">
<title>G1 PRISM — 지방1사업부 성과관리 플랫폼</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#fafbfc; --line:#e3e6ea; --line2:#eef0f3;
  --ink:#161a1f; --ink2:#4a5361; --ink3:#7b8595; --acc:#1d5fd0; --acc2:#e8f0fd;
  --up:#0f7b52; --upbg:#e6f5ee; --dn:#c0392f; --dnbg:#fdeceb; --warn:#a86a00; --warnbg:#fdf3e0;
  --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --r:10px;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#161b22; --panel2:#1b212a; --line:#262d38; --line2:#1f2630;
    --ink:#e7ecf3; --ink2:#a9b4c2; --ink3:#6d7887; --acc:#5b9bff; --acc2:#14243d;
    --up:#3fd18b; --upbg:#0f2a1f; --dn:#ff7a6e; --dnbg:#31161a; --warn:#e0a844; --warnbg:#2c2110;
    --sh:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161b22; --panel2:#1b212a; --line:#262d38; --line2:#1f2630;
  --ink:#e7ecf3; --ink2:#a9b4c2; --ink3:#6d7887; --acc:#5b9bff; --acc2:#14243d;
  --up:#3fd18b; --upbg:#0f2a1f; --dn:#ff7a6e; --dnbg:#31161a; --warn:#e0a844; --warnbg:#2c2110;
  --sh:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}

/* ── gate ── */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0d1b33 0%,#132b4d 45%,#0b1b2e 100%);z-index:50;padding:20px}
#gate .box{width:100%;max-width:330px;text-align:center;color:#eaf1fb}
#gate .mark{width:44px;height:44px;margin:0 auto 16px;border-radius:12px;
  background:linear-gradient(135deg,#4d8dff,#7ad0ff);box-shadow:0 8px 24px rgba(60,130,255,.4);
  position:relative}
#gate .mark:after{content:"";position:absolute;inset:12px;border:2.5px solid rgba(255,255,255,.92);border-radius:3px;
  border-right-color:transparent;border-bottom-color:transparent;transform:rotate(-45deg)}
#gate h1{font-size:26px;letter-spacing:.06em}
#gate .sub{margin-top:6px;font-size:13px;color:#9fb6d6}
#gate .msg{margin:22px 0 10px;font-size:12.5px;color:#a8bdd9;min-height:18px}
#gate .msg.err{color:#ff9b91}
#gate input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.07);color:#fff;font-size:16px;text-align:center;letter-spacing:.16em;outline:none}
#gate input:focus{border-color:#5b9bff;background:rgba(255,255,255,.11)}
#gate button{width:100%;margin-top:10px;padding:13px;border-radius:9px;border:0;cursor:pointer;
  background:linear-gradient(135deg,#2f7bf0,#4d8dff);color:#fff;font-weight:700;letter-spacing:.16em}
#gate .foot{margin-top:22px;font-size:11px;color:#6d84a5;line-height:1.7}

/* ── chrome ── */
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:52px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.logo{font-weight:800;font-size:16px;letter-spacing:.06em;color:var(--acc);white-space:nowrap}
.office{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.chip{padding:2px 7px;border-radius:20px;background:var(--acc2);color:var(--acc);font-size:11px;font-weight:700}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  cursor:pointer;color:var(--ink2);font-size:14px;line-height:1;flex:none}
.iconbtn:hover{background:var(--acc2);color:var(--acc)}
.tabs{position:sticky;top:52px;z-index:19;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs button{padding:11px 12px;border:0;background:none;cursor:pointer;color:var(--ink3);
  font-size:13px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button[aria-current="true"]{color:var(--acc);border-bottom-color:var(--acc)}
main{padding:16px 0 60px}
footer.foot{border-top:1px solid var(--line);padding:14px 0 26px;font-size:11px;color:var(--ink3)}
footer.foot .wrap{display:flex;gap:10px;flex-wrap:wrap}

/* ── 타이틀 배너 ── */
.banner{position:relative;border-radius:14px;overflow:hidden;margin-bottom:14px;
  height:clamp(148px,17vw,208px);box-shadow:0 2px 10px rgba(10,25,50,.18);isolation:isolate}
.banner svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bntxt{position:absolute;left:clamp(16px,3vw,30px);top:50%;transform:translateY(-50%);
  color:#fff;z-index:2;max-width:74%}
.bneyebrow{font-size:11.5px;font-weight:700;letter-spacing:.22em;color:#9fd0ff;
  text-transform:uppercase;text-shadow:0 1px 6px rgba(0,20,40,.7)}
.bntitle{font-size:clamp(19px,2.9vw,32px);font-weight:800;letter-spacing:-.03em;margin-top:5px;
  text-shadow:0 2px 14px rgba(0,15,35,.75)}
.bnsub{font-size:clamp(11px,1.25vw,13px);color:#d3e6fb;margin-top:7px;line-height:1.6;
  text-shadow:0 1px 8px rgba(0,15,35,.8)}
.bnbadge{position:absolute;right:clamp(14px,2.4vw,24px);top:clamp(12px,2vw,18px);z-index:2;
  padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:700;color:#eaf3ff;
  background:rgba(10,30,60,.42);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(3px)}
@media(max-width:520px){ .bnsub .hide-s{display:none} .bnbadge{display:none} }

/* ── breadcrumb / scope ── */
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px}
.crumb button{border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:20px;
  cursor:pointer;color:var(--ink2);font-weight:600}
.crumb button:hover{border-color:var(--acc);color:var(--acc)}
.crumb .cur{padding:5px 11px;border-radius:20px;background:var(--acc);color:#fff;font-weight:700}
.crumb .sep{color:var(--ink3)}

/* ── cards ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px}
.card>h3{padding:12px 14px;border-bottom:1px solid var(--line2);font-size:13.5px}
.card>h3 small{font-weight:500;color:var(--ink3);font-size:11.5px;margin-left:6px}
.pad{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--sh)}
.kpi .k{font-size:11.5px;color:var(--ink3);font-weight:600}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:600;color:var(--ink3);margin-left:3px}
.kpi .d{font-size:11.5px;margin-top:3px;color:var(--ink3);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--ink3)}
.tagUp{background:var(--upbg);color:var(--up)} .tagDn{background:var(--dnbg);color:var(--dn)}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}

/* ── tables ── */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll th.l:first-child,.scroll td.l:first-child{position:sticky;left:0;z-index:2;
  background:var(--panel);box-shadow:1px 0 0 var(--line2)}
.scroll th.l:first-child{background:var(--panel2);z-index:3}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th{background:var(--panel2);color:var(--ink3);font-weight:700;font-size:11.5px;position:sticky;top:0;
  text-align:right;cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
th.nos{cursor:default}
tbody tr:hover{background:var(--panel2)}
tbody tr.clk{cursor:pointer}
td.name{font-weight:600;color:var(--ink);max-width:230px;overflow:hidden;text-overflow:ellipsis}
.rank{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:6px;
  background:var(--panel2);color:var(--ink3);font-size:11px;font-weight:800;border:1px solid var(--line2)}
.rank.r1{background:#f7c948;color:#4a3a00;border-color:#e0b23c}
.rank.r2{background:#d5dbe3;color:#3c4653;border-color:#c3cad4}
.rank.r3{background:#e4b98a;color:#4d3115;border-color:#d3a877}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;min-width:56px}
.bar>i{display:block;height:100%;border-radius:3px}
.gr{display:inline-block;min-width:34px;text-align:center;padding:1px 5px;border-radius:5px;font-weight:800;font-size:11px}
.gS{background:#2f7bf0;color:#fff}.gAp{background:#4d9be0;color:#fff}.gA{background:#7bb5e8;color:#123}
.gBp{background:#f0c36d;color:#3a2a00}.gB{background:#f0a86d;color:#3a1c00}
.gCp{background:#e8836d;color:#fff}.gC{background:#d9534f;color:#fff}.gX{background:var(--line2);color:var(--ink3)}

/* ── office grid ── */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.ocard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;
  cursor:pointer;box-shadow:var(--sh);transition:border-color .12s,transform .12s}
.ocard:hover{border-color:var(--acc);transform:translateY(-1px)}
.ocard .t{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ocard .nm{font-weight:800;font-size:14px}
.ocard .v{font-size:20px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ocard .s{font-size:11.5px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
.ocard svg{display:block;margin-top:8px;width:100%;height:34px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{padding:5px 11px;border:0;background:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ctl input[type=search],.ctl select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--ink);font-size:12.5px;outline:none;min-width:120px}
.ctl input[type=search]:focus,.ctl select:focus{border-color:var(--acc)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.75}
.hl{background:var(--acc2);color:var(--acc);padding:0 3px;border-radius:3px;font-weight:700}
.hm td.c{text-align:center;font-weight:700;font-size:11.5px;color:#fff;border-radius:0}
.empty{padding:26px;text-align:center;color:var(--ink3);font-size:12.5px}
#tip{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);opacity:0;
  background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;
  pointer-events:none;transition:.18s;z-index:40}
#tip.on{opacity:1;transform:translateX(-50%) translateY(0)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chartbox{max-width:780px;margin:0 auto}
.chartbox svg{width:100%;height:auto;display:block}
@media(max-width:640px){
  .kpi .v{font-size:20px}
  th,td{padding:6px 7px;font-size:12px}
  .wrap{padding:0 10px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
  .topbar .wrap{gap:6px}
  .who span:not(.chip){display:none}
}
@media(max-width:480px){ .office{display:none} }
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <div class="mark"></div>
    <h1>G1 PRISM</h1>
    <div class="sub">지방1사업부 · 성과관리 플랫폼</div>
    <div class="msg" id="_m">사번 뒤 7자리를 입력해 주세요 <span style="opacity:.6">(앞 120 제외)</span></div>
    <input id="pw" inputmode="numeric" autocomplete="off" placeholder="사번 뒤 7자리" aria-label="사번">
    <button id="go" type="button">접 속</button>
    <div class="foot">대웅제약 병원본부 지방1사업부 내부용<br><span id="gfoot"></span></div>
  </div>
</div>
<div id="app" hidden>
  <header class="topbar"><div class="wrap">
    <div class="brand"><span class="logo">G1 PRISM</span><span class="office" id="officeLbl"></span></div>
    <div class="spacer"></div>
    <div class="who"><span class="chip" id="whoChip"></span><span id="whoName"></span></div>
    <button class="iconbtn" id="themeBtn" type="button" title="화면 밝기 전환" aria-label="화면 밝기 전환">◐</button>
    <button class="iconbtn" id="outBtn" type="button" title="접속 해제" aria-label="접속 해제">⏻</button>
  </div></header>
  <nav class="tabs"><div class="wrap" id="tabs"></div></nav>
  <main><div class="wrap"><div id="banner"></div><div id="crumb"></div><div id="view"></div></div></main>
  <footer class="foot"><div class="wrap"><span id="srcflag"></span><span id="srcnote"></span></div></footer>
</div>
<div id="tip" role="status" aria-live="polite"></div>
<script>

<script>

var NM=D.nMonths, KEYS=D.monthKeys, CLOSED=D.closed;

/* ═══════════ 포맷 ═══════════ */
function nf(v,d){ if(v==null||isNaN(v))return"—"; d=d||0;
  var s=Math.abs(v).toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return (v<0?"-":"")+s; }
function sf(v,d){ if(v==null||isNaN(v))return"—"; return (v>0?"+":"")+nf(v,d); }
function pf(v,d){ if(v==null||isNaN(v)||!isFinite(v))return"—"; d=(d==null?1:d);
  return (v>0?"+":"")+v.toFixed(d)+"%"; }
function cls(v){ return v>0?"up":v<0?"dn":"mut"; }
function tagOf(v,d){ return '<span class="tag '+(v>0?"tagUp":v<0?"tagDn":"")+'">'+pf(v,d)+'</span>'; }
function grCalc(cur,base){ if(!(base>1)) return null; return (cur/base-1)*100; }
function grTag(cur,base,d){
  if(!(base>1)) return cur>0?'<span class="tag tagUp">신규</span>':'<span class="tag">—</span>';

  if(v>400) return '<span class="tag tagUp">+400%↑</span>';

}
function gcls(g){ return {"S":"gS","A+":"gAp","A":"gA","B+":"gBp","B":"gB","C+":"gCp","C":"gC"}[g]||"gX"; }

/* ═══════════ 공식 지표 (기준점·최종실적) ═══════════ */
function offSeries(oi,which){ var a=D.official[which][oi], r=new Float64Array(NM);
  for(var m=0;m<NM;m++) r[m]=a[m]/OU; return r; }
function divSeries(which){ var r=new Float64Array(NM);

function repSeries(ri,which){ var a=D.official[which==="offBase"?"repBase":"repFinal"][ri]||[], r=new Float64Array(NM);
  for(var m=0;m<NM;m++) r[m]=(a[m]||0)/OU; return r; }
function sum(arr,idx){ var s=0; for(var i=0;i<idx.length;i++) s+=arr[idx[i]]; return s; }

/* scope → {base:Float64Array, final:Float64Array, hc:int, label} */
function scopeOfficial(sc){

  if(sc.lv==="office")return {base:offSeries(sc.oi,"offBase"), fin:offSeries(sc.oi,"offFinal")};
  return {base:repSeries(sc.ri,"offBase"), fin:repSeries(sc.ri,"offFinal")};
}
function headcount(sc){
  if(sc.lv==="rep") return 1;
  var n=0,o;
  if(sc.lv==="office"){ return D.official.offHc[sc.oi][NM-1]||countRep(sc.oi); }
  for(o=0;o<NO;o++) n+=D.official.offHc[o][NM-1]||countRep(o);
  return n;
}
function countRep(oi){ var n=0; for(var r=0;r<NR;r++) if(repAct[r]&&repOff[r]===oi) n++; return n; }

/* ═══════════ 상세 집계 (거래처×품목 셀) ═══════════ */
function accMask(sc){
  if(sc.lv==="div") return null;

  for(var i=0;i<NA;i++) m[i]= (sc.lv==="office"? accOff[i]===sc.oi : accRep[i]===sc.ri)?1:0;

function seriesOf(sc,prodFilter){

/* ═══════════ SVG ═══════════ */
function spark(vals,w,h,col,fill){
  var mx=0,mn=0,i;
  for(i=0;i<vals.length;i++){ if(vals[i]>mx)mx=vals[i]; if(vals[i]<mn)mn=vals[i]; }
  var rng=(mx-mn)||1, pts=[], sx=w/Math.max(1,vals.length-1);
  for(i=0;i<vals.length;i++) pts.push((i*sx).toFixed(1)+","+(h-(vals[i]-mn)/rng*h).toFixed(1));
  var p=pts.join(" ");
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    (fill?'<polygon points="0,'+h+' '+p+' '+w+','+h+'" fill="'+col+'" opacity=".13"/>':'')+
    '<polyline points="'+p+'" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}
/* 월별 실적 vs 기준점 */
function monthChart(fin,base,prev){
  var W=680,H=200,PL=44,PB=26,PT=12,PR=6, n=CLOSED;
  var mx=0,i;
  for(i=0;i<n;i++){ mx=Math.max(mx,fin[I26[i]],base[I26[i]],prev?prev[I25[i]]:0); }
  mx=mx*1.12||1;
  var iw=W-PL-PR, ih=H-PT-PB, bw=iw/n, y=function(v){return PT+ih-v/mx*ih;};
  var s='<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'">';
  for(i=0;i<=4;i++){ var gv=mx*i/4, gy=y(gv);
    s+='<line x1="'+PL+'" x2="'+W+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line2)" stroke-width="1"/>'+
       '<text x="'+(PL-6)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--ink3)">'+nf(gv)+'</text>'; }
  var pp=[];
  for(i=0;i<n;i++){
    var x=PL+i*bw, cx=x+bw/2, v=fin[I26[i]], b=base[I26[i]], pv=prev?prev[I25[i]]:0;
    if(prev) s+='<rect x="'+(x+bw*0.14).toFixed(1)+'" y="'+y(pv).toFixed(1)+'" width="'+(bw*0.32).toFixed(1)+'" height="'+Math.max(0,(ih+PT-y(pv))).toFixed(1)+'" fill="var(--line)" rx="2"/>';
    s+='<rect x="'+(x+bw*0.48).toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+(bw*0.32).toFixed(1)+'" height="'+Math.max(0,(ih+PT-y(v))).toFixed(1)+'" fill="'+(v>=b?"var(--acc)":"var(--dn)")+'" rx="2"/>';
    pp.push(cx.toFixed(1)+","+y(b).toFixed(1));
    s+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--ink3)">'+MN[i]+'</text>';
  }
  s+='<polyline points="'+pp.join(" ")+'" fill="none" stroke="var(--warn)" stroke-width="1.8" stroke-dasharray="4 3"/>';
  for(i=0;i<n;i++){ var c2=PL+i*bw+bw/2; s+='<circle cx="'+c2.toFixed(1)+'" cy="'+y(base[I26[i]]).toFixed(1)+'" r="2.4" fill="var(--warn)"/>'; }
  s+='</svg></div>';
  s+='<div class="legend"><span><i style="background:var(--acc)"></i>26년 최종실적</span>'+
     '<span><i style="background:var(--dn)"></i>기준점 미달 월</span>'+
     (prev?'<span><i style="background:var(--line)"></i>25년 동월</span>':'')+
     '<span><i style="background:var(--warn)"></i>기준점</span></div>';
  return s;
}

    c.onclick=function(){ var lv=c.getAttribute("data-lv"), i=+c.getAttribute("data-i");
      setScope(lv, lv==="office"?i:null, lv==="rep"?i:null); };});
  Array.prototype.forEach.call(v.querySelectorAll("tr.clk[data-i]"),function(r){
    r.onclick=function(){ setScope("office", +r.getAttribute("data-i")); };});
  Array.prototype.forEach.call(v.querySelectorAll("tr.clk[data-r]"),function(r){
    r.onclick=function(){ setScope("rep", null, +r.getAttribute("data-r")); };});
  Array.prototype.forEach.call(v.querySelectorAll("tr.clk[data-a]"),function(r){
    r.onclick=function(){ var ai=+r.getAttribute("data-a"), d=$("ad"+ai);
      if(!d) return;
      if(d.hidden){ d.firstChild.innerHTML=acctDetail(ai); d.hidden=false; r.lastChild.textContent="－"; }
      else { d.hidden=true; r.lastChild.textContent="＋"; } };});
  Array.prototype.forEach.call(v.querySelectorAll("tr.clk[data-eo]"),function(r){
    r.onclick=function(){ S.eo=r.getAttribute("data-eo"); render(); };});
  var key=S.tab;
  bindSort(key, key==="office"?{c:4,d:1}:key==="rep"?{c:4,d:1}:key==="acct"?{c:6,d:1}:{c:3,d:1});
  Array.prototype.forEach.call(v.querySelectorAll(".seg button[data-o]"),function(b){
    b.onclick=function(){ var o=+b.getAttribute("data-o");
      if(o<0) setScope("div"); else setScope("office",o); };});
  var q=$("q");
  if(q){ q.oninput=function(){ S.q=q.value; var p=q.selectionStart; render();
      var n=$("q"); if(n){ n.focus(); try{n.setSelectionRange(p,p);}catch(e){} } }; }
  var mo=$("more");
  if(mo) mo.onclick=function(){ S.pg[S.tab]=(S.pg[S.tab]||(S.tab==="acct"?60:50))+100; render(); };
}

/* ═══════════ 인증 · 부팅 ═══════════ */
function sha256(s){
  if(window.crypto&&crypto.subtle&&location.protocol!=="file:")
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2);}).join(""); });
  return Promise.resolve(sha256js(s));
}
function enter(u){
  ME={r:u.r==="div"?"div":(u.r==="office"?"office":"rep"), oi:u.o==null?0:u.o, ri:u.i==null?0:u.i, n:u.n};
  S.scope = ME.r==="div"?{lv:"div",oi:0,ri:0} : ME.r==="office"?{lv:"office",oi:ME.oi,ri:0} : {lv:"rep",oi:repOff[ME.ri],ri:ME.ri};
  $("gate").style.display="none"; $("app").hidden=false;
  $("whoChip").textContent = ME.r==="div"?"사업부":ME.r==="office"?"소장":"담당자";
  $("whoName").textContent = u.n;
  $("srcflag").textContent = D.source;
  $("srcnote").textContent = " · 단위 백만원 · " + D.scope;
  try{ sessionStorage.setItem("g1u", JSON.stringify(u)); }catch(e){}
  render();
}
function tryLogin(){
  var raw=($("pw").value||"").replace(/\D/g,""); var m=$("_m");
  if(raw.length<6){ m.className="msg err"; m.textContent="사번 뒤 7자리를 입력해 주세요"; return; }
  sha256(SALT+raw).then(function(hx){
    var u=null; for(var i=0;i<USERS.length;i++) if(USERS[i].h===hx) u=USERS[i];
    if(!u){ m.className="msg err"; m.textContent="등록되지 않은 사번입니다"; $("pw").value=""; return; }
    enter(u);
  });
}
function boot(){
  $("gfoot").textContent = D.source + " 기준";
  var th=null; try{ th=localStorage.getItem("g1theme"); }catch(e){}
  if(th) document.documentElement.setAttribute("data-theme",th);
  $("themeBtn").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var nx = cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",nx);
    try{ localStorage.setItem("g1theme",nx); }catch(e){}
  };
  $("outBtn").onclick=function(){ try{sessionStorage.removeItem("g1u");}catch(e){} location.reload(); };
  $("go").onclick=tryLogin;
  $("pw").onkeydown=function(e){ if(e.key==="Enter") tryLogin(); };
  var saved=null; try{ saved=JSON.parse(sessionStorage.getItem("g1u")); }catch(e){}
  if(saved&&saved.h){ for(var i=0;i<USERS.length;i++) if(USERS[i].h===saved.h){ enter(USERS[i]); return; } }
  $("pw").focus();
}
boot();
})();
